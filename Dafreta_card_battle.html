<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Infinite Duel</title>

<style>

.hurt .fig{animation:sh .3s,br 3.2s ease-in-out infinite}@keyframes sh{25%{translate:-6px}75%{translate:6px}}

.card.clDefender{background:linear-gradient(#d9a91f,#6e5208)}.card.clMagic{background:linear-gradient(#3a7fe0,#16305c)}.card.clHealer{background:linear-gradient(#2f9a57,#14452a)}.card.clAttacker{background:linear-gradient(#c93a3a,#5a1519)}.card.clSpecialist{background:linear-gradient(#8a55e0,#3a1a6e)}.card.clGeneral{background:linear-gradient(#8b93a7,#343a4d)}

.card .art{font-size:34px;font-style:normal;margin:6px 0}.card small{color:#e8ecf8;font-size:10px}.card.off{opacity:.4}.card.sel{opacity:1}.card.sel{outline:3px solid var(--gold)}

.scr{max-width:1100px}

.opt{position:relative}.opt small{color:var(--mu)}

/* hit reaction + EX glow */
.fig{animation:br 3.2s ease-in-out var(--dl,0s) infinite}

@keyframes exg{from{filter:drop-shadow(0 0 4px #ffd966) drop-shadow(0 0 10px #f5c451)}to{filter:drop-shadow(0 0 12px #fff3b0) drop-shadow(0 0 28px #ffb300) brightness(1.14)}}
