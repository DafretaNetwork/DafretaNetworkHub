<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Infinite Duel</title>

<style>

.hurt .fig{animation:sh .3s,br 3.2s ease-in-out infinite}@keyframes sh{25%{translate:-6px}75%{translate:6px}}

.card.clDefender{background:linear-gradient(#d9a91f,#6e5208)}.card.clMagic{background:linear-gradient(#3a7fe0,#16305c)}.card.clHealer{background:linear-gradient(#2f9a57,#14452a)}.card.clAttacker{background:linear-gradient(#c93a3a,#5a1519)}.card.clSpecialist{background:linear-gradient(#8a55e0,#3a1a6e)}.card.clGeneral{background:linear-gradient(#8b93a7,#343a4d)}

.card .art{font-size:34px;font-style:normal;margin:6px 0}.card small{color:#e8ecf8;font-size:10px}.card.off{opacity:.4}.card.sel{opacity:1}.card.sel{outline:3px solid var(--gold)}

.scr{max-width:1100px}

.opt{position:relative}.opt small{color:var(--mu)}

/* hit reaction + EX glow */
.fig{animation:br 3.2s ease-in-out var(--dl,0s) infinite}

@keyframes exg{from{filter:drop-shadow(0 0 4px #ffd966) drop-shadow(0 0 10px #f5c451)}to{filter:drop-shadow(0 0 12px #fff3b0) drop-shadow(0 0 28px #ffb300) brightness(1.14)}}

/* =====================================================================
   RANKED: matchmaking queue, real-player battles (lockstep), bots, coin toss
   ---------------------------------------------------------------------
   Queue:   cardgame/mmq/{user}  = {t, n, a, f, img, pts, lu, m?}
   Match:   cardgame/mt/{id}     = {A:{u,n,a,f,img,pts,lu}, B:{...}, seed, t, x:{k0000:{...}, k0001:{...}}}
   Both screens build the same battle from the same seed and replay the same
   action log (x), so every card draw, crit and random roll is identical.
   ===================================================================== */
let MM={on:0},mmK=0,PV=0,PVS=null,OPP=null,AIQ=3,BOTS=[];
const AIN=()=>[0,7,4.5,2.6,1.3,.4][AIQ]||2.6,AIMIS=()=>[0,.3,.17,.08,.03,0][AIQ]||.08;
const mb32=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const pk=n=>'k'+String(n).padStart(4,'0'),mmFmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),SV={'.sv':'timestamp'};
const shuf2=a=>{for(let i=a.length;i>1;){const j=Math.floor(Math.random()*i--);[a[i],a[j]]=[a[j],a[i]]}return a};
const FAKEN=['NightOwl_23','Kidlat','RiftHunter','Bagwis','xVenomx','Tala_Star','GhostBlade','Ember_PH','Kaiju77','SilentAce'];
function myTeam(){const l=PD.lineups[PD.sel]||{},ids=(l.h||[]).map(hidx);return{hs:ids.map(i=>evH(HD[i])),rl:ids.map(i=>REL.find(r=>r.id===(l.r||{})[hk(HD[i])])||null),gen:(l.g||[]).map(id=>GEN.find(g=>g.id===id)).filter(g=>gAvail(g))}}
function myLU(){const l=PD.lineups[PD.sel]||{},ids=(l.h||[]).map(hidx);return{h:ids.map(i=>String(HD[i].fid)),e:ids.map(i=>hs(HD[i]).ev|0),r:ids.map(i=>(l.r||{})[hk(HD[i])]||''),s:ids.map(i=>skinOf(HD[i])),g:(l.g||[]).filter(id=>gAvail(GEN.find(g=>g.id===id)))}}
function teamFrom(lu){if(!lu)return null;const h=Object.values(lu.h||{}),e=Object.values(lu.e||{}),r=Object.values(lu.r||{}),g=Object.values(lu.g||{}),sk=Object.values(lu.s||{});
 const hs2=h.map((f,i)=>{const j=hidx(f);return j<0?null:applySkin(evHAt(HD[j],+e[i]||0),String(sk[i]||''),1)});if(hs2.length!==4||hs2.some(x=>!x))return null;
 return{hs:hs2,rl:hs2.map((_,i)=>REL.find(x=>x.id===r[i])||null),gen:g.map(id=>GEN.find(x=>x.id===id)).filter(Boolean)}}
function myCard(){const im=PROF&&PROF.img&&String(PROF.img).length<60000?PROF.img:'';return{u:ME,n:myName(),a:(PROF&&+PROF.avatar)||0,f:(PROF&&PROF.frame)||'none',img:im,pts:PD.pts|0}}

function mmStart(){if(MM.on)return;const lo=Math.max(10,+CFG.botMin||60),hi=Math.min(600,Math.max(lo+6,+CFG.botMax||180));
 MM={on:1,t0:Date.now(),botAt:Math.round((lo+1+Math.random()*(hi-lo-2))*1000),lu:myLU(),busy:0,n:0,key:++mmK,tok:null};
 SND.click();renderHome();MM.iv=setInterval(mmTick,1000);if(ME){gtok().then(t=>{if(MM.on)MM.tok=t});mmJoinQ()}}

 if(MM.busy)return;if(Date.now()-MM.t0>=MM.botAt){mmBot();return}if(ME&&MM.n%3===0)mmPoll()}
/* look for another player waiting for Ranked; the alphabetically-first of a pair starts the match */
async function mmPoll(){const k=MM.key;MM.busy=1;try{
 const q=await fb('cardgame/mmq');if(k!==MM.key)return;const mine=q&&q[ME];
 if(!mine||!mine.t){await mmJoinQ();return}
 if(mine.m){await mmGuest(mine.m,k);return}
 fb('cardgame/mmq/'+ME+'/t','PUT',SV).catch(()=>{});
 const my=PD.pts|0,c=Object.entries(q||{}).filter(([u,v])=>u!==ME&&v&&!v.m&&v.lu&&(+v.t||0)>=(+mine.t||0)-12000).sort((a,b)=>Math.abs((a[1].pts|0)-my)-Math.abs((b[1].pts|0)-my));
 const pick=c.find(([u])=>ME<u);if(pick)await mmHost(pick[0],pick[1],k);
}catch(e){}finally{if(k===MM.key)MM.busy=0}}
async function mmHost(gu,gv,k){const id=mid()+Math.random().toString(36).slice(2,6),seed=(Math.random()*4294967295)>>>0,
 m={A:{...myCard(),lu:MM.lu},B:{u:gu,n:gv.n||gu,a:+gv.a||0,f:gv.f||'none',img:gv.img||'',pts:+gv.pts||0,lu:gv.lu},seed,t:SV};
 try{await fb('','PATCH',{['cardgame/mt/'+id]:m,['cardgame/mmq/'+ME+'/m']:id,['cardgame/mmq/'+gu+'/m']:id})}catch(e){return}
 let ok=0;for(let i=0;i<12&&!ok;i++){await sl(1000);const x0=await fb('cardgame/mt/'+id+'/x/'+pk(0)).catch(()=>null);if(x0&&x0.t==='join')ok=1}
 if(!ok){try{await fb('cardgame/mt/'+id+'/x/'+pk(0),'PUT',{t:'abort'});fb('cardgame/mmq/'+ME+'/m','DELETE').catch(()=>{});fb('cardgame/mt/'+id,'DELETE').catch(()=>{});return}catch(e){ok=1}}

 mmMatched(id,'A',m)}
async function mmGuest(id,k){const m=await fb('cardgame/mt/'+id).catch(()=>null),clr=()=>fb('cardgame/mmq/'+ME+'/m','DELETE').catch(()=>{});
 if(k!==undefined&&k!==MM.key)return;
 if(!m||!m.A||!m.B||m.B.u!==ME){await clr();return}
 const x0=m.x&&m.x[pk(0)];if(x0){if(x0.t==='join')return mmMatched(id,'B',m);await clr();return}
 try{await fb('cardgame/mt/'+id+'/x/'+pk(0),'PUT',{t:'join',s:'B'})}catch(e){const y=await fb('cardgame/mt/'+id+'/x/'+pk(0)).catch(()=>null);if(y&&y.t==='join')return mmMatched(id,'B',m);await clr();return}

async function mmMatched(id,side,m){mmStop();if(!m||!m.A||!m.B){toast('The match was cancelled');renderHome();return}
 const me=m[side],op=m[side==='A'?'B':'A'],TA=teamFrom(m.A.lu),TB=teamFrom(m.B.lu);
 if(!TA||!TB){toast('Could not load the line-ups. Please try again.');renderHome();return}
 PV=1;PVS={id,me:side,op:side==='A'?'B':'A',seed:m.seed>>>0,ptsA:+m.A.pts||0,ptsB:+m.B.pts||0,next:0,seen:0,q:{},run:0,afk:{A:0,B:0},acted:{A:0,B:0},endSent:0,autoSent:0,tuSent:0,called:0,ordered:0,turn:'A',tok:null};
 PVS.coin=((PVS.seed>>>5)^(PVS.seed>>>17))&1?'h':'t';PVS.ready=new Promise(r=>{PVS.readyRes=r});
 OPP={n:op.n||op.u,p:cardP(op),pts:+op.pts||0,bot:0,u:op.u};
 /* build both teams in a fixed order (A then B) from the shared seed, so both screens are identical */
 rn=mb32(PVS.seed);uid=0;const A=mk(TA.hs,TA.rl,TA.gen),B=mk(TB.hs,TB.rl,TB.gen);PVS.T={A,B};
 P=side==='A'?A:B;E=side==='A'?B:A;curMode='rank';curTeam=(side==='A'?TA:TB).hs;
 if(!PD.played){PD.played=true;saveP('played')}lbUpd();turn='p';over=1;inB=0;pvListen();
 matchFound(()=>showIntro(curTeam,(side==='A'?TB:TA).hs))}

/* ---------------- bots ---------------- */
const emIdx=()=>{const t=rkTiers(),i=t.findIndex(x=>/emerald/i.test(x.n));return i<0?Math.min(4,Math.max(0,t.length-2)):i};
const tierOf=ri=>{let k=0;rkTiers().forEach((x,i)=>{if(ri>=x.i)k=i});return k};
const BRNG=[[0,1],[0,2],[1,3],[2,3],[2,5],[3,8]];
function botLU(b){const tier=tierOf(rkI(b.pts)),canTC=tier>=emIdx();let [lo,hi]=BRNG[Math.min(BRNG.length-1,tier)];if(!canTC){hi=Math.min(hi,3);lo=Math.min(lo,hi)}
 const cfg=b.h||[],used=new Set(),heroes=[],pool=shuf2(HD.slice());
 for(let i=0;i<4;i++){const c=cfg[i]||{};let h=c.f?HD[hidx(c.f)]:null;if(h&&(used.has(h.cl)||heroes.some(x=>x.h===h)))h=null;
  if(!h)h=pool.find(x=>!used.has(x.cl)&&!heroes.some(y=>y.h===x))||pool.find(x=>!heroes.some(y=>y.h===x));if(!h)break;used.add(h.cl);
  let e=(c.e!==undefined&&c.e!==''&&c.e!=='auto'&&!isNaN(+c.e))?+c.e:lo+Math.floor(Math.random()*(hi-lo+1));if(!canTC)e=Math.min(e,3);heroes.push({h,e:Math.max(0,Math.min(MAXEV,e))})}
 const fr=shuf2(REL.slice()),rc=Math.min(.9,.12+tier*.16);
 return{hs:heroes.map(x=>evHAt(x.h,x.e)),rl:heroes.map((_,i)=>Math.random()<rc?fr[i]||null:null),gen:shuf2(GEN.filter(g=>!g.locked)).slice(0,2),tier}}
async function pickBot(){const lb=await ensureLB().catch(()=>({}))||{},my=PD.pts|0;
 const L=BOTS.map(b=>{const e=lb['bot_'+b.id];return{...b,pts:e&&!isNaN(+e.pts)?+e.pts:b.pts}}).sort((x,y)=>Math.abs(x.pts-my)-Math.abs(y.pts-my));
 return L.length?L[Math.floor(Math.random()*Math.min(3,L.length))]:null}
async function mmBot(){const k=MM.key;MM.busy=1;
 if(ME){const q=await fb('cardgame/mmq/'+ME).catch(()=>null);if(k!==MM.key)return;if(q&&q.m){await mmGuest(q.m,k);if(k===MM.key)MM.busy=0;return}}
 const b=await pickBot();if(k!==MM.key)return;mmStop();
 startBot(b||{id:null,n:FAKEN[Math.random()*FAKEN.length|0],a:Math.random()*16|0,f:'none',pts:Math.max(0,(PD.pts|0)+Math.round((Math.random()-.5)*80)),iq:'auto',h:[]})}

 curMode='rank';curTeam=tm.hs;if(!PD.played){PD.played=true;saveP('played')}lbUpd();

  return fb(k,'PUT',{n:d.n,a:d.a|0,f:d.f||'none',pts:np,w:(d.w|0)+(win?0:1),l:(d.l|0)+(win?1:0),bot:true})}).then(()=>{LBt=0}).catch(()=>{})}
