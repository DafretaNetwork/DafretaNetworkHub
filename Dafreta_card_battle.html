<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Infinite Duel</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--p:#151b36;--tx:#e8ecf8;--mu:#8d96b8;--gold:#f5c451;--bad:#ff4d6d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(120% 70% at 50% 0,#1d2658,#0b1020 62%) fixed;color:var(--tx);font:14px/1.35 system-ui,sans-serif;min-height:100vh}
h1,h2{font-family:Cinzel,Georgia,serif;letter-spacing:.04em;margin:.1em 0}h1{font-size:clamp(28px,7vw,50px);font-weight:800}
[hidden]{display:none!important}small{color:var(--mu);font-size:12px}
.scr{max-width:900px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:10px}.sub{color:var(--mu);margin:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opt img{height:70px;object-fit:contain}.opt{align-items:center;text-align:center;background:var(--p);border:1px solid #2a3260;border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}.opt.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
button.main{background:var(--gold);color:#241800;border:0;border-radius:10px;padding:12px;font:700 15px system-ui;cursor:pointer}button:disabled{opacity:.4}
:focus-visible{outline:2px solid #6fd3ff;outline-offset:2px}
#top{display:flex;align-items:center;gap:10px;font:600 13px Cinzel,serif}#inf{flex:1;text-align:right;color:var(--mu);font:12px system-ui}
#stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:420px;padding:58px 6px 10px;border:3px solid #5c3a1e;border-radius:12px;background:linear-gradient(#d2a874,#a4733f 70%,#8a5d32);overflow:hidden}
#stage:before{content:"";position:absolute;inset:0 0 auto;height:50px;background:repeating-linear-gradient(90deg,#8d2233 0 24px,#6b1623 24px 48px);border-bottom:4px solid var(--gold)}
#vs{font:800 22px Cinzel,serif;color:#5c3a1e}.team{display:flex;gap:4px;width:100%;justify-content:space-around;align-items:flex-end}
.unit{position:relative;width:24%;max-width:210px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px;padding-top:6px}
.fig{height:clamp(70px,17vw,125px);max-width:100%;object-fit:contain;transform-origin:50% 100%;animation:br 3.2s ease-in-out infinite;pointer-events:none}@keyframes br{50%{transform:scale(1.025,1.05)}}
.unit.dead .fig{animation:none;transform:rotate(80deg) translateY(14px);opacity:.45;filter:grayscale(1)}.unit.tg{cursor:pointer;background:#fff3;outline:2px dashed var(--gold)}
.unit .mt b{min-width:38px;font-size:10px}.unit .mt i{width:14px;font-size:11px}.unit .nm{font-size:11px}.unit .info{padding:4px 5px}.unit .tr{height:9px}.unit .chips{min-height:18px}.unit .stc{font-size:11px;padding:0 3px}
.ow{font:700 9px system-ui;font-style:normal;color:#111;border-radius:6px;padding:1px 5px}
.info{background:#0d1230dd;border-radius:10px;padding:6px 8px;width:100%;display:flex;flex-direction:column;gap:4px}.nm{font:700 13px Cinzel,serif;text-align:center}
.mt{display:flex;align-items:center;gap:5px}.mt i{font-style:normal;font-size:13px;width:18px;text-align:center}
.tr{position:relative;flex:1;height:12px;border-radius:999px;background:#05081a;border:1px solid #fff2;overflow:hidden}
.f{position:absolute;top:0;bottom:0;left:0;border-radius:999px;transition:width .3s,left .3s}
.hp{background:linear-gradient(#5be39b,#2e9e5b)}.shd{background:#fff;box-shadow:0 0 6px #fff}.at{background:linear-gradient(#ff7b7b,#c93a3a)}.xv{background:linear-gradient(#ffd966,#c99a1f)}
.mt b{font:700 12px system-ui;min-width:62px;text-align:right}.mt u{text-decoration:none;color:#fff;text-shadow:0 0 5px #7cf}.mt small{font-weight:400}
.chips{display:flex;gap:3px;flex-wrap:wrap;min-height:24px;justify-content:center}.stc{background:#000a;border:1px solid #fff4;border-radius:8px;padding:1px 5px;font-size:14px}.stc sub{font-size:10px}
.exb{position:absolute;top:-4px;font-size:11px;z-index:2;background:var(--gold);color:#241800;border:0;border-radius:8px;padding:3px 7px;font-weight:800;cursor:pointer;animation:pu .8s infinite alternate}@keyframes pu{to{transform:scale(1.12)}}
.fl{position:absolute;top:20%;left:50%;font:800 30px Cinzel,serif;text-shadow:0 2px 0 #000;animation:fl 1.1s forwards;pointer-events:none}@keyframes fl{from{transform:translate(-50%,0)}to{transform:translate(-50%,-60px);opacity:0}}
.hurt .fig{animation:sh .3s,br 3.2s ease-in-out infinite}@keyframes sh{25%{translate:-6px}75%{translate:6px}}
#lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mu)}#log{min-height:3.9em;color:var(--mu)}#log div:last-child{color:var(--tx)}
#bot{display:flex;align-items:center;gap:6px}
#en{flex:0 0 64px;height:64px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:#2f6fe0;display:flex;align-items:center;justify-content:center;font:800 15px Cinzel,serif}
#end{flex:0 0 84px;height:84px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:var(--gold);color:#241800;border:0;font:800 11px system-ui;padding:0;cursor:pointer}
#hand,#pl{display:flex;gap:8px;overflow-x:auto;padding:10px 6px 8px 0;flex-wrap:nowrap}#hand{flex:1}#pl{flex-wrap:wrap}
.card{flex:0 0 108px;min-height:150px;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:8px 6px;border-radius:10px;border:2px solid #f5e6c0;cursor:pointer}
.card.atk{background:linear-gradient(#b3303a,#5a1519)}.card.sup{background:linear-gradient(#2f9a57,#14452a)}.card.utl{background:linear-gradient(#3a6cc4,#16305c)}
.card.clDefender{background:linear-gradient(#d9a91f,#6e5208)}.card.clMagic{background:linear-gradient(#3a7fe0,#16305c)}.card.clHealer{background:linear-gradient(#2f9a57,#14452a)}.card.clAttacker{background:linear-gradient(#c93a3a,#5a1519)}.card.clSpecialist{background:linear-gradient(#8a55e0,#3a1a6e)}.card.clGeneral{background:linear-gradient(#8b93a7,#343a4d)}
.card .c{position:absolute;left:-7px;top:-7px;width:24px;height:24px;border-radius:6px;background:#fff;color:#111;font:700 13px/24px system-ui}
.card .art{font-size:34px;font-style:normal;margin:6px 0}.card small{color:#e8ecf8;font-size:10px}.card.off{opacity:.4}.card.sel{opacity:1}.card.sel{outline:3px solid var(--gold)}
#hand .card:nth-child(odd){rotate:-2deg}#hand .card:nth-child(even){rotate:2deg}
#ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;text-align:center;z-index:9}#ov>div{background:var(--p);padding:28px;border-radius:14px;display:flex;flex-direction:column;gap:14px}
@media(prefers-reduced-motion:reduce){.exb,.fl,.fig,.hurt .fig{animation:none}}

.scr{max-width:1100px}
#stage{flex-direction:row;justify-content:center;align-items:flex-end;min-height:330px;gap:0;padding:70px 4px 12px}
#vs{font-size:18px;align-self:center;padding:0 4px}
.team{flex:1;width:auto;gap:2px;justify-content:center}
.unit{width:25%;max-width:150px}
.fig{height:clamp(80px,16vw,170px)}
.foe .fig{scale:-1 1}
.unit.fr .info{box-shadow:0 0 0 1px var(--gold)}
.unit .mt b{min-width:26px;font-size:9px}.unit .mt i{display:none}.unit .tr{height:8px}.unit .nm{font-size:10px}.unit .stc{font-size:10px}
#hand{display:flex;justify-content:center;overflow:visible;padding:46px 0 0;min-height:200px;flex:1}
.card{transform-origin:50% 130%;transform:translateY(var(--y,0)) rotate(var(--r,0deg));transition:transform .15s}
.card:hover,#hand .card.sel{transform:translateY(-36px) rotate(0) scale(1.1);z-index:50!important}
#hand .card:nth-child(odd),#hand .card:nth-child(even){rotate:0deg}

.opt{position:relative}.opt small{color:var(--mu)}
.ib{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:1px solid #fff5;background:#0009;color:#fff;font:italic 700 13px/20px Georgia,serif;padding:0;cursor:pointer;z-index:2}
#pop{position:fixed;z-index:30;width:min(340px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;background:#10163a;border:2px solid var(--gold);border-radius:14px;box-shadow:0 10px 40px #000c;pointer-events:none}
#pop.pin{pointer-events:auto}
.pimg{height:190px;overflow:hidden;background:radial-gradient(#2b3678,#10163a);display:flex;justify-content:center}
.pimg img{flex:none;height:380px;width:auto;max-width:none;object-fit:contain;object-position:50% 0}
.pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}.pb h3{margin:0;font:800 20px Cinzel,serif}
.pcl{align-self:flex-start;color:#111;font:700 11px system-ui;padding:1px 9px;border-radius:99px}
.pst{color:var(--mu)}.pst b{color:var(--tx)}
.pu{background:#f5c45118;border:1px solid #f5c45155;border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.pb h4{margin:4px 0 0;font:700 12px system-ui;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
.ps{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid #fff1}.ps small{display:block}
.pc{flex:none;width:22px;height:22px;border-radius:6px;background:#fff;color:#111;font:700 12px/22px system-ui;text-align:center}
.px{position:absolute;top:6px;right:8px;display:none;width:26px;height:26px;border-radius:50%;border:0;background:#000a;color:#fff;cursor:pointer;font-size:14px}#pop.pin .px{display:block}
.rw{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--p);border:1px solid #2a3260;border-radius:10px;padding:8px 10px}
.rw select{background:#0d1230;color:var(--tx);border:1px solid #2a3260;border-radius:8px;padding:6px;font:inherit;max-width:100%}
.rw .rd{flex:1 1 100%;color:var(--mu)}.rw>span{flex:1 1 120px}
.gcd{position:relative}.gcd .c{position:absolute;left:-6px;top:-6px;width:22px;height:22px;border-radius:6px;background:#fff;color:#111;font:700 12px/22px system-ui;text-align:center}
.gcd .art{font-size:30px;font-style:normal}
.rlc{font-size:12px}

/* hit reaction + EX glow */
.fig{animation:br 3.2s ease-in-out var(--dl,0s) infinite}
@keyframes hit{0%{translate:0 0;filter:none}12%{translate:-10px 0;filter:sepia(1) saturate(8) hue-rotate(-48deg) brightness(1.15)}30%{translate:9px 0;filter:sepia(1) saturate(8) hue-rotate(-48deg) brightness(1.15)}50%{translate:-6px 0;filter:sepia(1) saturate(6) hue-rotate(-48deg)}72%{translate:3px 0;filter:sepia(.5) saturate(3) hue-rotate(-30deg)}100%{translate:0 0;filter:none}}
@keyframes exg{from{filter:drop-shadow(0 0 4px #ffd966) drop-shadow(0 0 10px #f5c451)}to{filter:drop-shadow(0 0 12px #fff3b0) drop-shadow(0 0 28px #ffb300) brightness(1.14)}}
.unit:not(.dead).hurt .fig{animation:hit .5s ease-out 0s 1,br 3.2s ease-in-out var(--dl,0s) infinite}
/* sound button */
.snd{position:fixed;right:10px;bottom:10px;z-index:40;width:40px;height:40px;border-radius:50%;border:1px solid #fff4;background:#0b1230cc;color:#fff;font-size:18px;cursor:pointer;padding:0}
#snh{color:var(--gold)}
/* VS intro */
#vsx{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:linear-gradient(90deg,#0f2150 0%,#0a1230 47%,#2c0b12 53%,#561319 100%);overflow:hidden;cursor:pointer}
#vsx.out{opacity:0;transition:opacity .4s}
#vsx::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:vfl .55s 1s both}
@keyframes vfl{0%,100%{opacity:0}10%{opacity:.8}}
.vtop{display:flex;justify-content:space-between;align-items:center;padding:14px 4vw 0;animation:vtp .6s both}
@keyframes vtp{from{opacity:0;translate:0 -30px}}
.vn{display:flex;align-items:center;gap:12px;font:800 clamp(18px,3vw,30px) Cinzel,serif}
.vn img{width:clamp(48px,7vw,74px);aspect-ratio:1;border-radius:50%;object-fit:cover;object-position:50% 8%;border:4px solid #c9893a;background:#222;box-shadow:0 0 14px #000a}
.vn.l{color:#9cc3ff}.vn.r{color:#ff9c9c}
.vrow{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 1.5vw 18px;animation:vsh .5s 1s}
@keyframes vsh{20%{translate:-8px 4px}40%{translate:7px -4px}60%{translate:-4px 2px}80%{translate:3px -1px}}
.vteam{display:flex;gap:clamp(4px,.6vw,10px)}
.vp{width:min(calc((100vw - 17vw)/8 - 8px),170px);height:min(68vh,560px);background:var(--c);clip-path:polygon(50% 0,100% 13%,100% 87%,50% 100%,0 87%,0 13%);flex:none}
.vteam.l .vp{animation:vpl .6s cubic-bezier(.15,.85,.3,1) both;animation-delay:calc(var(--i)*.1s + .05s)}
.vteam.r .vp{animation:vpr .6s cubic-bezier(.15,.85,.3,1) both;animation-delay:calc(var(--i)*.1s + .05s)}
@keyframes vpl{from{translate:-110vw 0}}@keyframes vpr{from{translate:110vw 0}}
.vpi{position:relative;margin:3px;height:calc(100% - 6px);clip-path:polygon(50% 0,100% 13%,100% 87%,50% 100%,0 87%,0 13%);background:linear-gradient(#ffffff18,#0007),color-mix(in srgb,var(--c) 35%,#0b1020);overflow:hidden}
.vpi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 5%}
.vlb{position:absolute;left:0;right:0;bottom:0;padding:34% 4px 14%;text-align:center;background:linear-gradient(transparent,color-mix(in srgb,var(--c) 60%,#000));display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 4px #000}
.vlb span{font:700 clamp(10px,1.15vw,15px) system-ui;white-space:nowrap}.vlb b{font:800 clamp(11px,1.25vw,17px) Cinzel,serif;color:#ffffffd0;white-space:nowrap}
#vvs{flex:none;width:clamp(70px,11vw,150px);aspect-ratio:1;margin:0 -1.2vw;z-index:2;display:grid;place-items:center;background:linear-gradient(135deg,#f0b34a,#8a4a12);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);font:italic 900 clamp(28px,5vw,64px) Georgia,serif;color:#fff;text-shadow:0 3px 0 #5a2a08,0 0 18px #ffd27a;animation:vsin .5s .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes vsin{from{scale:4;opacity:0}}
.vskip{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#fff8;font:12px system-ui}
@media(max-width:700px){.vrow{flex-direction:column;gap:0}.vteam{width:100%;justify-content:center}.vp{width:calc((100vw - 30px)/4 - 6px);height:27vh}#vvs{margin:-2.5vh 0;width:70px}}
@media(prefers-reduced-motion:reduce){.unit .fig,.unit:not(.dead).hurt .fig,.unit.exr .fig{animation:none}.unit.exr .fig{filter:drop-shadow(0 0 10px #ffd966)}.vp,.vtop,.vrow,#vvs,#vsx::after{animation:none}}

.rg::before{content:"";position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,#fff 78%,transparent 84% 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:spin 1.1s linear infinite}

const fb=(p,m,b)=>fetch(FB+'/'+p+'.json',{method:m||'GET',headers:{'Content-Type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)}).then(r=>{if(!r.ok)throw new Error('db '+r.status);return r.json()});
const mid=()=>Date.now().toString(36).padStart(9,'0')+Math.random().toString(36).slice(2,5);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},3400)};
let ME=null,PROF=null,PD=null,LBD=null,LBt=0,AM={},QUESTS=[],RANKS=[],APPR={},curMode='std',curTeam=[],pgNow='battle',ed=0,rtok=0,efl='',rt=-1,hdi=-1,hdTab='info',hdSk=[],RSV=null,rsStage=1,cmT=0;
const CFG={maxLv:10,frag:[20,30,40,50],stone:1,evoB:[1,2,3,4],rankStep:100,rankWin:25,rankLoss:15,unlock:50,expLv:100,expWin:100,expLoss:0};
const COL={Defender:'#f5c451',Magic:'#5aa9ff',Healer:'#5be39b',Attacker:'#ff5a5a',Specialist:'#b07cff'};
const CI={Defender:'🛡️',Healer:'➕',Magic:'✦',Attacker:'⚔️',Specialist:'★'};
try{const s=JSON.parse(localStorage.dn_s||'null');if(s&&s.u)ME=s.u}catch(e){}
const defPD=()=>({played:false,sel:0,mode:'std',lineups:{},hs:{},fr:{},st:0,gc:{},own:{},disp:'',w:0,l:0,pts:0,qp:{}});
async function loadPD(){let d=null;
 if(ME){try{d=await fb('cardgame/players/'+ME)}catch(e){}try{PROF=await fb('profiles/'+ME)}catch(e){}}
 else{try{d=JSON.parse(localStorage.dfg||'null')}catch(e){}}
 PD={...defPD(),...(d||{})};['lineups','hs','fr','gc','own','qp'].forEach(k=>{if(!PD[k]||typeof PD[k]!=='object')PD[k]={}});
 PD.st=+PD.st||0;PD.pts=+PD.pts||0;PD.w=+PD.w||0;PD.l=+PD.l||0;PD.sel=Math.max(0,Math.min(4,+PD.sel||0));PD.disp=PD.disp||'';if(!['std','story','rank'].includes(PD.mode))PD.mode='std'}
function saveP(...ks){if(!PD)return;if(ME){const o={};ks.forEach(k=>o[k]=PD[k]);fb('cardgame/players/'+ME,'PATCH',o).catch(()=>{})}else{try{localStorage.dfg=JSON.stringify(PD)}catch(e){}}}
function lbUpd(){if(!ME||!PD)return;fb('cardgame/lb/'+ME,'PUT',{n:(PROF&&PROF.name)||ME,a:(PROF&&+PROF.avatar)||0,f:(PROF&&PROF.frame)||'none',pts:PD.pts|0,w:PD.w|0}).catch(()=>{});LBt=0}
const ensureLB=async()=>{if(!LBD||Date.now()-LBt>30000){LBD=await fb('cardgame/lb').catch(()=>null)||{};LBt=Date.now()}return LBD};
const myName=()=>(PROF&&PROF.name)||ME||'You';

/* ---- avatars (same look as the network site) ---- */
const AVE=['🧙','⚔️','🏹','🐉','🦊','🤖','👹','🧛','🥷','🐺','🦅','💀','🧝','🐲','👽','🦁'];
const FRM={none:'#26364d',bronze:'linear-gradient(135deg,#d98a3d,#6b3d12)',silver:'linear-gradient(135deg,#fff,#7d8590)',gold:'linear-gradient(135deg,#ffe27a,#c47f00,#ffe27a)',neon:'linear-gradient(135deg,#00f0ff,#0050ff)',flame:'linear-gradient(0deg,#ff2d00,#ffb300)',rainbow:'conic-gradient(#f33,#fd3,#3f6,#3df,#35f,#f3d,#f33)',void:'linear-gradient(135deg,#fff,#111 50%,#fff)'};
const avH=(p,s)=>{p=p||{};const im=p.img&&/^(data:image\/|https?:)/.test(p.img);return '<div class="av" style="--s:'+s+'px;--f:'+(FRM[p.frame]||FRM.none)+'"><span'+(im?' style="background:center/cover url(\''+p.img+'\')"':'')+'>'+(im?'':AVE[p.avatar|0]||AVE[0])+'</span></div>'};

/* ---- ranks ---- */
const RN=['Copper','Silver','Gold','Platinum','Emerald','Diamond'],RC=['#c27c3a','#c3ccd6','#ffd24a','#8fe3d8','#38d27c','#6cd4ff'],RR=['I','II','III','IV','V'];
const defRanks=()=>RN.flatMap(n=>RR.map(r=>({n:n+' '+r})));
const rkI=p=>Math.max(0,Math.min(RANKS.length-1,Math.floor((p||0)/Math.max(1,CFG.rankStep))));
const rkC=i=>RC[Math.min(RC.length-1,Math.floor(i/5))];
const rkE=(i,s)=>{const r=RANKS[i]||{};return r.img?'<img class="rke" src="'+r.img+'" alt="" style="width:'+s+'px;height:'+s+'px">':'<svg class="rke" width="'+s+'" height="'+s+'" viewBox="0 0 40 40"><path d="M20 3l14 6v11c0 9-6 15-14 18C12 35 6 29 6 20V9z" fill="'+rkC(i)+'" stroke="#0008" stroke-width="2"/><text x="20" y="25" text-anchor="middle" font-family="Cinzel,serif" font-weight="800" font-size="13" fill="#1a1204">'+RR[i%5]+'</text></svg>'};

/* ---- heroes: ownership, levels, evolutions ---- */
const hk=h=>String(h.fid).replace(/^hd_/,'');
const hs=h=>PD.hs[hk(h)]||{lv:1,ev:0,xp:0};
const owned=h=>!h.src||!h.src.locked||!!PD.own[hk(h)];
const ROM=['','II','III','IV','Transcendent'],STG=['I','II','III','IV','TC'];
const embH=st=>'<span class="emb e'+st+'">'+STG[st||0]+'</span>';
const evName=(h,e)=>{const ev=(h.src&&h.src.evo&&h.src.evo[e])||{};return ev.name||(e>=4?'Transcendent '+h.n:h.n+' '+ROM[e])};
const hidx=fid=>HD.findIndex(h=>hk(h)===String(fid).replace(/^hd_/,''));
const gAvail=g=>g&&(!g.locked||(PD&&PD.gc[g.id]));
const needGen=()=>Math.min(2,GEN.filter(gAvail).length);
const dd=(id,dur)=>{const m=AM[id];return m&&m.k?[m.k,+dur||2]:null};
function buildHero(h,fid,b,name,img){b=+b||0;const cl=h.class_==='Mage'?'Magic':(COL[h.class_]?h.class_:'Specialist'),col=COL[cl],at=Math.max(1,+h.atk||1),
 cs=(Array.isArray(h.cards)?h.cards:Object.values(h.cards||{})).filter(c=>c&&c.name),up=n=>(+n>0?+n+b:0);
 const o={id:'u'+fid,fid,cl,n:name||h.name||'Hero',bn:h.name||'Hero',col,hp:Math.max(1,+h.hp||50),atk:at,ap:null,img:img||h.img||ph(col),A:[],S:[],X:null,cr:+h.created||0,src:h,st:0};
 cs.forEach(c=>{const v0=+c.value||0,m=AM[c.ail],d=dd(c.ail,c.dur),
  ex=s=>{const sh=up(c.shield),hl=up(c.heal);if(sh)s.sh=(s.sh||0)+sh;if(hl)s.h=(s.h||0)+hl;if(+c.draw)s.dr=+c.draw},
  hit=s=>{if(+c.hits>1)s.x=Math.min(5,+c.hits);if(c.scope=='pierce')s.k='p';else if(c.scope=='all')s.k='a'};
  if(c.type==='ultimate'){if(o.X)return;const v=up(v0),X={n:c.name},u=c.ult||'all';
   if(u=='all'||u=='front'){X.d=v>0?v/at:1;if(u=='all')X.k='a';if(d)X.ap=d;if(m&&m.sh)X.sh=m.sh}
   else if(u=='ally'){if(v>0)X.h=v;if(d)X.me=d}
   else{if(u=='heal')X.h=v||10;else X.sh=v||10;X.tm=1;if(d)X.me=d}
   ex(X);if(!(X.d||X.h||X.sh||X.me||X.dr))return;o.X=X;return}
  const s={n:c.name,c:Math.max(0,+c.manaCost||0)};
  if(c.type==='heal'){s.h=up(v0)||5;if(d)s.me=d;if(c.target==='self')s.self=1}
  else if(c.type==='mana')s.en=v0||1;
  else if(c.type==='draw')s.dr=v0||1;
  else if(c.type==='buff'){if(m&&m.sh)s.sh=m.sh;else if(d)s.me=d;else s.sh=up(v0)||5;if(c.target==='self')s.self=1}
  else if(c.type==='debuff'){if(v0>0){s.d=up(v0)/at;hit(s)}if(d)s.ap=d;if(!s.d&&!s.ap)return;if(c.target==='enemy')s.any=1}
  else{const v=up(v0);s.d=v>0?v/at:1;hit(s);if(d)s.ap=d;if(m&&m.sh)s.sh=m.sh}
  ex(s);o.S.push(s)});
 return o.S.length?o:null}
function evH(h){const e=hs(h).ev|0;if(!e||!h.src)return h;const ev=(h.src.evo&&h.src.evo[e])||{},b=(ev.bonus===undefined||ev.bonus===''||ev.bonus===null)?(CFG.evoB[e-1]||0):+ev.bonus;
 const o=buildHero(h.src,h.fid,b,evName(h,e),ev.img||h.img);if(!o)return h;o.bn=h.n;o.st=e;o.cr=h.cr;return o}
const evNeed=e=>({fr:CFG.frag[e]||0,st:e===3?CFG.stone:0});
function evolve(k){const h=HD.find(x=>hk(x)===k);if(!h)return;const s=PD.hs[k]||{lv:1,ev:0},e=s.ev|0;if(e>=4)return;const n=evNeed(e);
 if(s.lv<CFG.maxLv)return toast('Reach level '+CFG.maxLv+' first');if((PD.fr[k]||0)<n.fr)return toast('Not enough card fragments');if(PD.st<n.st)return toast('You need a Transcendence stone');
 PD.fr[k]=(PD.fr[k]||0)-n.fr;PD.st-=n.st;PD.hs[k]={lv:1,ev:e+1,xp:0};saveP('fr','st','hs');SND.ult();toast('✨ '+h.n+' evolved to '+evName(h,e+1)+'!');hdRender()}
function unlockHero(k){const h=HD.find(x=>hk(x)===k);if(!h||owned(h))return;if((PD.fr[k]||0)<CFG.unlock)return toast('You need '+CFG.unlock+' card fragments');
 PD.fr[k]-=CFG.unlock;PD.own[k]=true;saveP('fr','own');SND.ult();toast('🎉 '+h.n+' unlocked!');hdRender()}

/* ---- match results: EXP, levels, rank points, quests ---- */
function result(win){const R={win,heroes:[],rank:null,quests:[]};if(!PD||!curTeam.length)return R;PD.played=true;const gain=win?CFG.expWin:CFG.expLoss;
 curTeam.forEach(h=>{const k=hk(h),s=PD.hs[k]=PD.hs[k]||{lv:1,ev:0,xp:0},b={lv:s.lv,xp:s.xp||0},ups=[];s.xp=s.xp||0;const wasMax=s.lv>=CFG.maxLv;
  if(!wasMax&&gain>0){s.xp+=gain;while(s.xp>=CFG.expLv&&s.lv<CFG.maxLv){s.xp-=CFG.expLv;s.lv++;ups.push(s.lv)}if(s.lv>=CFG.maxLv)s.xp=0}
  R.heroes.push({h,b,a:{lv:s.lv,xp:s.xp},gain:wasMax?0:gain,ups,max:wasMax})});
 if(win)PD.w++;else PD.l++;
 if(curMode==='rank'){const b=rkI(PD.pts);PD.pts=Math.max(0,PD.pts+(win?CFG.rankWin:-CFG.rankLoss));const a=rkI(PD.pts);R.rank={d:win?CFG.rankWin:-CFG.rankLoss,a,up:a>b,down:a<b}}
 if(win)QUESTS.forEach(q=>{if(q.mode!=='any'&&q.mode!==curMode)return;const p=PD.qp[q.id]=PD.qp[q.id]||{w:0};if(p.c||p.w>=q.wins)return;p.w++;R.quests.push({t:q.t,w:p.w,n:q.wins})});
 saveP('played','w','l','hs','pts','qp');lbUpd();return R}
function claim(id){const q=QUESTS.find(x=>x.id===id);if(!q)return;const p=PD.qp[id]||{w:0};if(p.c||p.w<q.wins)return;const r=q.rw||{},amt=Math.max(1,+r.amt||1);let txt;
 if(r.type==='frag'){let h=r.hero&&r.hero!=='random'?HD.find(x=>hk(x)===String(r.hero).replace(/^hd_/,'')):null;if(!h)h=HD[Math.random()*HD.length|0];PD.fr[hk(h)]=(PD.fr[hk(h)]||0)+amt;txt=amt+' '+h.n+' card fragments'}
 else if(r.type==='gen'){const g=GEN.find(x=>x.id===r.gen);PD.gc[r.gen]=true;txt='the general card '+(g?g.s.n:'')}
 else{PD.st+=amt;txt=amt+' Transcendence stone'+(amt>1?'s':'')}
 p.c=Date.now();PD.qp[id]=p;saveP('fr','gc','st','qp');SND.heal();toast('Quest complete! You received '+txt+'.');renderHome()}
async function invite(k,btn){const key='dfinv_'+k,t=+localStorage[key]||0;if(Date.now()-t<864e5)return toast('You already invited them today');
 try{await fb('','PATCH',{['inbox/'+k+'/notes/'+mid()]:{type:'inv',from:ME,t:Date.now()}});localStorage[key]=Date.now();toast('Invite sent! They will get a notification.');if(btn){btn.disabled=true;btn.textContent='Invited ✓'}}catch(e){toast('Could not send the invite')}}

/* ================= DECK / LINE-UP HELPERS ================= */
const resH=()=>{const fr=Object.values(PD.fr).reduce((a,b)=>a+(+b||0),0);return '<span class="rsi" title="Card fragments">🧩 '+fr+'</span><span class="rsi" title="Transcendence stones">💠 '+PD.st+'</span>'};
function validLU(l){const ids=((l&&l.h)||[]).map(hidx);if(ids.length!=4||ids.some(i=>i<0))return 'Build a deck of 4 heroes first.';
 if(ids.some(i=>!owned(HD[i])))return 'Your line-up has a hero you have not unlocked.';
 if(new Set(ids.map(i=>HD[i].cl)).size!=4)return 'A deck can only have 1 hero per class.';
 if(((l.g||[]).filter(id=>gAvail(GEN.find(g=>g.id===id)))).length<needGen())return 'Pick '+needGen()+' general cards.';return ''}
function deckHTML(l,edit){
 const hsl=(k,j)=>{const i=k==null?-1:hidx(k);if(i<0)return '<div class="em"'+(edit?' data-slot="'+j+'"':'')+'>＋</div>';const x=evH(HD[i]),s=hs(HD[i]);
  return '<div class="dh zf'+(edit&&rt===i?' sel':'')+'" style="--c:'+x.col+'"'+(edit?' data-dh="'+i+'"':'')+' title="'+esc(x.n)+'"><img src="'+x.img+'" alt="" referrerpolicy="no-referrer"><b class="lvb">'+s.lv+'</b>'+(s.ev?'<span class="stb">'+STG[s.ev]+'</span>':'')+(j===0?'<em class="frt">Front</em>':'')+(edit?'<span class="mv"><button data-mv="'+j+':-1">‹</button><button data-mv="'+j+':1">›</button></span>':'')+'</div>'};
 const rsl=(k,j)=>{const i=k==null?-1:hidx(k);if(i<0)return '<div class="em dim"></div>';const r=REL.find(q=>q.id===(l.r||{})[k]);return r?'<div class="dr'+(edit&&rt===i?' sel':'')+'"'+(edit?' data-dr="'+i+'"':'')+' title="'+esc(r.n)+'">'+rIc(r)+'<small>'+esc(r.n)+'</small></div>':'<div class="em'+(edit&&rt===i?' sel':'')+'"'+(edit?' data-dr="'+i+'"':'')+'>'+(edit?'＋':'')+'</div>'};
 const gsl=n=>{const g=GEN.find(x=>x.id===(l.g||[])[n]);return g?'<div class="dg"'+(edit?' data-dg="'+n+'"':'')+' title="'+esc(g.s.n)+'"><i>'+art(g.s)+'</i><small>'+esc(g.s.n)+'</small></div>':(n<needGen()||edit&&n<2&&GEN.length>n?'<div class="em"'+(edit?' data-dg="'+n+'"':'')+'>'+(edit?'＋':'')+'</div>':'<div class="em dim"></div>')};
 const hh=[0,1,2,3].map(j=>(l.h||[])[j]);
 return '<div class="dk">'+gsl(0)+hh.map((k,j)=>hsl(k,j)).join('')+gsl(1)+hh.map((k,j)=>rsl(k,j)).join('')+'</div>'}
const bufLU=()=>{const l={h:hi.map(i=>hk(HD[i])),r:{},g:GS.slice()};hi.forEach(i=>{if(RL[i])l.r[hk(HD[i])]=RL[i]});return l};
const faceImg=x=>'<img src="'+x.img+'" alt="" referrerpolicy="no-referrer">';

/* ================= DASHBOARD ================= */
const modeTxt={any:'Win in Standard or Ranked',std:'Win in Standard',rank:'Win in Ranked'};
const qIc=q=>(q.rw||{}).type==='frag'?'🧩':(q.rw||{}).type==='gen'?'🃏':'💠';
function qH(q){const p=PD.qp[q.id]||{w:0},w=Math.min(q.wins,p.w||0),done=w>=q.wins,cl=!!p.c,r=q.rw||{},amt=Math.max(1,+r.amt||1);
 return `<div class="qr${cl?' cl':''}"><div class="qm"><b>${esc(q.t)}</b><div class="qb"><i style="width:${w/q.wins*100}%"></i><span>${w}/${q.wins}</span></div><small>${modeTxt[q.mode]||modeTxt.any}</small></div>
  <button class="qw${done&&!cl?' go':''}" data-q="${esc(q.id)}" ${done&&!cl?'':'disabled'} title="${done&&!cl?'Tap to claim':cl?'Claimed':'Reward'}"><i>${qIc(q)}</i><small>${cl?'✓':(r.type==='gen'?'×1':amt)}</small></button></div>`}
function tbH(){const ri=rkI(PD.pts),tl=HD.reduce((a,h)=>{const s=hs(h);return a+s.lv+s.ev*CFG.maxLv},0);
 return `<div class="tb"><div class="pf">${avH(PROF,62)}<div class="pn"><b>${esc(myName()==='You'?'Guest':myName())}</b><small>${ME?'Total Lv '+tl:'Guest · log in on Dafreta Network to save online'}</small><span class="rkl">${rkE(ri,18)} ${esc((RANKS[ri]||{}).n||'')}</span></div></div>
  <div class="rs"><span id="snh" hidden>🔊 Tap anywhere for music</span>${resH()}</div></div>`}
function dispHero(){let h=PD.disp&&HD.find(x=>hk(x)===PD.disp&&owned(x));if(!h){const l=PD.lineups[PD.sel]||{};h=(l.h||[]).map(k=>HD[hidx(k)]).find(Boolean)}return h||HD.find(owned)}
const RCY='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-15.5-6.2L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15.5 6.2L21 16"/><path d="M21 21v-5h-5"/></svg>';
function pgBattle(){const l=PD.lineups[PD.sel]||{h:[],r:{},g:[]},dh=dispHero(),dx=dh&&evH(dh);
 const tabs=[0,1,2,3,4].map(i=>`<button class="pt${i===PD.sel?' on':''}" data-p="${i}">${i+1}</button>`).join('')+'<button class="pt el" id="el">✎ Edit Line-up</button>';
 const md=[['std','Standard','⚔️'],['story','Story','📖'],['rank','Ranked','🏅']],bad=validLU(l);
 return `<div class="bp">${APPR.bg?`<img class="bbg" src="${APPR.bg}" alt=""><div class="bsh"></div>`:''}
 ${dx?`<div class="bartw"><img class="bart" src="${dx.img}" alt="" referrerpolicy="no-referrer"></div><button class="rcy" id="rcy" title="Change display hero" aria-label="Change display hero">${RCY}</button>`:''}
 <div class="qs pnl"><h3>Quests</h3>${QUESTS.length?QUESTS.map(qH).join(''):'<p class="sub">No quests right now. Check back soon!</p>'}</div>
 <div class="bb"><div class="lu pnl"><div class="lt">${tabs}</div><div class="lg">${deckHTML(l,false)}${bad?`<p class="sub warn">⚠ ${bad} Tap “Edit Line-up”.</p>`:''}</div></div>
 <div class="mp"><div class="mds">${md.map(([k,n,ic])=>`<button class="md${PD.mode===k?' on':''}" data-m="${k}"><i>${ic}</i>${n}</button>`).join('')}</div><button class="play" id="play">Play</button></div></div></div>`}
async function pgFriends(){if(!ME)return '<div class="pnl pad"><h3>Friends</h3><p class="sub">Log in on Dafreta Network to see your friends here.</p></div>';
 const fr=Object.keys(await fb('inbox/'+ME+'/fr').catch(()=>null)||{}),lb=await ensureLB(),pr=await Promise.all(fr.map(k=>fb('profiles/'+k).catch(()=>null)));
 const rows=fr.map((k,i)=>{const p=pr[i]||{},l=lb[k],inv=(+localStorage['dfinv_'+k]||0)>Date.now()-864e5;
  return `<div class="fr">${avH(p,46)}<div class="fi"><b>${esc(p.name||k)}</b><small>${l?rkE(rkI(l.pts),16)+' '+esc((RANKS[rkI(l.pts)]||{}).n||'')+' · '+(l.w|0)+' wins':'Hasn’t played Card Battle yet'}</small></div>${l?'<span class="tag">Playing</span>':`<button class="inv" data-k="${esc(k)}" ${inv?'disabled':''}>${inv?'Invited ✓':'Invite to play'}</button>`}</div>`}).join('');
 return `<div class="pnl pad"><h3>Friends</h3>${rows||'<p class="sub">No friends yet. Add friends on Dafreta Network and they will show up here.</p>'}</div>`}
async function pgLB(){const lb=await ensureLB(),ar=Object.entries(lb).map(([k,v])=>({k,...v})).sort((a,b)=>(b.pts-a.pts)||(b.w-a.w)),top=ar.slice(0,50),
 pr=await Promise.all(top.slice(0,20).map(r=>fb('profiles/'+r.k).catch(()=>null))),mine=ar.findIndex(r=>r.k===ME);
 const rows=top.map((r,i)=>{const p=i<20&&pr[i]?pr[i]:{avatar:r.a,frame:r.f},ri=rkI(r.pts);return `<div class="fr lbr${r.k===ME?' me':''}"><span class="pos">${i+1}</span>${avH(p,42)}<div class="fi"><b>${esc(r.n||r.k)}</b><small>${rkE(ri,16)} ${esc((RANKS[ri]||{}).n||'')}</small></div><div class="pts"><b>${r.pts|0}</b><small>pts</small></div></div>`}).join('');
 return `<div class="pnl pad"><h3>🏆 Ranked Leaderboard</h3><p class="sub">${mine>=0?'Your position: #'+(mine+1):'Play a Ranked match to join the board.'}</p>${rows||'<p class="sub">Nobody is ranked yet. Be the first!</p>'}</div>`}
