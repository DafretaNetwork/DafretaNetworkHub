<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dafreta Network</title>
<link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/DafretaNetwork/DafretaNetworkHub/refs/heads/main/aseets/image/logo/dafreta-network-favicon.webp">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#08101c;--panel2:#0c1727;--line:#1d3350;--ink:#e6edf7;--mute:#7f93ad;--gold:#f5b335;--blue:#3b8bff;--red:#ff5468;--ok:#47d18c}
*{box-sizing:border-box;margin:0}
body{background:#000;color:var(--ink);font:500 16px/1.5 Barlow,system-ui,sans-serif;min-height:100vh;
background-image:radial-gradient(ellipse 70% 40% at 50% -10%,#0d2447 0,transparent 70%)}
h1,h2,h3,h4,.logo,button,.tab{font-family:'Chakra Petch',Barlow,sans-serif}
a{color:var(--blue);text-decoration:none}
nav{display:flex;align-items:center;gap:18px;padding:12px 24px;border-bottom:1px solid var(--line);background:#000c;position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
.logo{font-weight:700;font-size:22px;color:var(--gold);letter-spacing:.5px;cursor:pointer}
.logo small{color:var(--ink);font-weight:500}
nav .sp{flex:1}
nav a.l{color:var(--ink);padding:6px 4px;border-bottom:2px solid transparent}
nav a.l:hover{border-color:var(--gold)}
.sw{position:relative;width:240px}
.sw input{width:100%}
#sr{position:absolute;top:44px;left:0;right:0;background:var(--panel2);border:1px solid var(--line);display:none}
#sr a{display:flex;gap:10px;align-items:center;padding:8px 10px;color:var(--ink)}
#sr a:hover{background:#12223a}
main{max-width:1080px;margin:0 auto;padding:30px 20px 80px}
input,select,textarea{background:#050b14;border:1px solid var(--line);color:var(--ink);padding:10px 12px;font:inherit;outline:none;width:100%}
input:focus,select:focus{border-color:var(--gold)}
label{display:block;color:var(--mute);font-size:14px;margin:12px 0 4px}
button{cursor:pointer;border:0;background:var(--gold);color:#201400;font-weight:700;font-size:15px;padding:10px 20px;
clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
button:hover{filter:brightness(1.12)}
button.g{background:#14243c;color:var(--ink)}
button.d{background:var(--red);color:#fff}
button.s{padding:5px 12px;font-size:13px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.box{background:var(--panel);border:1px solid var(--line);padding:22px;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;padding:30px 0 40px}
.hero h1{font-size:clamp(38px,6vw,68px);line-height:1;color:#fff}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{color:var(--mute);margin:16px 0 22px;max-width:46ch}
.row{display:flex;gap:10px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pl{display:flex;gap:12px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.pl:hover{border-color:var(--gold)}
.pl b{display:block}.pl span{color:var(--mute);font-size:13px}
.av{--s:100px;width:var(--s);height:var(--s);padding:calc(var(--s)*.05);background:var(--f);flex:none;display:grid;
clip-path:polygon(14% 0,100% 0,100% 86%,86% 100%,0 100%,0 14%)}
.av span{display:grid;place-items:center;font-size:calc(var(--s)*.55);background:radial-gradient(circle at 50% 35%,#223a5c,#050a12);
clip-path:polygon(14% 0,100% 0,100% 86%,86% 100%,0 100%,0 14%)}
.char{display:grid;grid-template-columns:300px 1fr;gap:20px}
.char .side{text-align:center}
.char .side .av{margin:6px auto 14px}
.char h2{font-size:28px;color:var(--gold)}
.stat{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0;color:var(--mute);text-align:left}
.stat b{color:var(--ink)}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.bd{background:var(--panel2);border:1px solid var(--rc);padding:14px 10px;text-align:center;position:relative;
box-shadow:inset 0 -3px 0 var(--rc)}
.bd i{font-style:normal;font-size:38px;display:block}
.bd b{display:block;font-family:'Chakra Petch';margin-top:4px}
.bd small{display:block;color:var(--mute);font-size:12.5px;line-height:1.3;margin-top:3px}
.bd em{font-style:normal;font-size:12px;color:var(--rc)}
.bd .x{position:absolute;top:4px;right:4px;padding:1px 7px;font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:10px 18px;cursor:pointer;color:var(--mute)}
.tab.on{color:var(--gold);border-bottom:2px solid var(--gold)}
.pk{display:flex;gap:24px;flex-wrap:wrap}
.grid{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;max-width:430px}
.ch{width:46px;height:46px;padding:0;font-size:24px;background:#0a1626;border:1px solid var(--line);clip-path:none;display:grid;place-items:center}
.ch.fb{background:var(--f)}
.ch.sel{border-color:var(--gold);outline:2px solid var(--gold)}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mute);font-weight:500;font-size:14px}
td,th{padding:9px 8px;border-bottom:1px solid var(--line)}
.tg{display:flex;align-items:center;gap:8px;margin:14px 0}.tg input{width:auto}
.msg{padding:10px 14px;margin:10px 0;border-left:3px solid var(--red);background:#1a0a10}
.msg.ok{border-color:var(--ok);background:#08170f}
#toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--gold);padding:12px 18px;display:none;z-index:50}
.auth{max-width:400px;margin:30px auto}
.mut{color:var(--mute)}
@media(max-width:760px){.hero,.char{grid-template-columns:1fr}.sw{width:140px}nav{gap:10px;padding:10px 12px}}
@media(prefers-reduced-motion:no-preference){.hero .av{animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}}

.logo img{height:38px;display:block}
.dot{background:var(--red);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px;margin-left:5px}
.heroW{position:relative;overflow:hidden;border:1px solid var(--line);margin:-6px 0 46px;padding:60px 44px;min-height:480px;display:flex;align-items:center;
background:radial-gradient(ellipse 55% 80% at 82% 50%,#10305f99,transparent 70%),#02060d;clip-path:polygon(30px 0,100% 0,100% calc(100% - 30px),calc(100% - 30px) 100%,0 100%,0 30px)}
#pt{position:absolute;inset:0;width:100%;height:100%}
.heroW .hero{position:relative;width:100%;padding:0}
.hero h1{font-size:clamp(46px,8vw,96px);text-shadow:0 0 40px #3b8bff66}
.hero h1 em{text-shadow:0 0 30px #f5b335aa}
.hero .av{filter:drop-shadow(0 0 28px #f5b33588)}
.sec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}.sec-h h2{font-size:36px}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:end;margin-bottom:16px}
.pc{text-align:center;padding:26px 12px 20px;background:linear-gradient(180deg,#0f2038,#050a12);border:1px solid var(--rk);color:var(--ink);position:relative;display:block;box-shadow:0 0 30px -8px var(--rk);transition:transform .2s}
.pc:hover{transform:translateY(-5px)}
.pc.r1{--rk:#f5b335;padding-top:46px;padding-bottom:34px;order:2;box-shadow:0 0 50px -6px var(--rk)}
.pc.r2{--rk:#c9d3e0;order:1}.pc.r3{--rk:#d98a3d;order:3}
.pc .rk{position:absolute;top:8px;left:14px;font:700 30px 'Chakra Petch';color:var(--rk)}
.pc .av{margin:0 auto}.pc b{display:block;font:700 21px 'Chakra Petch';margin-top:12px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pr{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .2s}
.pr:hover{border-color:var(--gold);transform:translateY(-4px)}
.im{display:grid;place-items:center;background:radial-gradient(circle,#173560,#050a12)}
.pr .im{height:180px;font-size:76px}
.pr .tx{padding:14px 18px 18px}.pr .tx b{font:700 19px 'Chakra Petch';display:block}.pr .tx span{color:var(--gold);font-weight:700;font-size:18px}
.ov{position:fixed;inset:0;background:#000a;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:60;display:grid;place-items:center;padding:16px;overflow:auto}
.md{background:#0a1220;border:1px solid var(--line);border-radius:26px;width:min(520px,100%);max-height:94vh;overflow:auto;padding:28px;box-shadow:0 30px 90px #000;position:relative}
.md .xx{position:absolute;top:14px;right:14px;width:34px;height:34px;padding:0;border-radius:50%;background:#14243c;color:var(--ink);clip-path:none}
.md input{border-radius:12px}
.mt{font:700 26px 'Chakra Petch';color:var(--gold)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.pm{background:#fff;border-radius:16px;height:76px;display:grid;place-items:center;padding:10px;clip-path:none;border:2px solid transparent}
.pm:hover{border-color:var(--gold)}.pm img{max-height:48px;max-width:100%}
.drop{border:2px dashed var(--line);border-radius:16px;padding:30px 14px;text-align:center;cursor:pointer;color:var(--mute)}
.drop:hover{border-color:var(--gold)}
.acct{background:#050b14;border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center}
.acct img{height:30px;background:#fff;border-radius:8px;padding:3px 6px}
.done{text-align:center;padding:8px 0}.done svg{width:100px;height:100px}
.done circle{stroke:var(--ok);stroke-width:3;fill:none;stroke-dasharray:158;stroke-dashoffset:158;animation:st .7s ease forwards}
.done path{stroke:var(--ok);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:48;stroke-dashoffset:48;animation:st .4s .6s ease forwards}
@keyframes st{to{stroke-dashoffset:0}}
.pf{width:90px;border-radius:8px;cursor:pointer;display:block}
@media(max-width:760px){.pod{grid-template-columns:1fr}.pc{order:0!important}.heroW{padding:36px 20px}.f2,.pay{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
<div class="logo" onclick="location.hash='#/'"><img src="https://raw.githubusercontent.com/DafretaNetwork/DafretaNetworkHub/refs/heads/main/aseets/image/logo/dafreta-network-logo-name.webp" alt="Dafreta Network"></div>
<div class="sw"><input id="q" placeholder="Search players" autocomplete="off" oninput="search(this.value)"><div id="sr"></div></div>
<div class="sp"></div><div id="nl" class="row"></div>
</nav>
<main id="app"></main>
<div id="toast"></div>
<script>
const DB='https://dafreta-network-default-rtdb.asia-southeast1.firebasedatabase.app';
const AV=['🧙','⚔️','🏹','🐉','🦊','🤖','👹','🧛','🥷','🐺','🦅','💀','🧝','🐲','👽','🦁'];
const F={none:'#26364d',bronze:'linear-gradient(135deg,#d98a3d,#6b3d12)',silver:'linear-gradient(135deg,#fff,#7d8590)',gold:'linear-gradient(135deg,#ffe27a,#c47f00,#ffe27a)',neon:'linear-gradient(135deg,#00f0ff,#0050ff)',flame:'linear-gradient(0deg,#ff2d00,#ffb300)',rainbow:'conic-gradient(#f33,#fd3,#3f6,#3df,#35f,#f3d,#f33)',void:'linear-gradient(135deg,#fff,#111 50%,#fff)'};
const RC={common:'#7f93ad',rare:'#3b8bff',epic:'#b36bff',legendary:'#f5b335'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,m='GET',b)=>{const r=await fetch(`${DB}/${p}.json`,{method:m,headers:{'Content-Type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw new Error('Database error '+r.status+'. Check your Firebase rules.');return r.json()};
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('dafreta:'+s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const hasImg=p=>/^data:image\//.test(p.img||'');
const av=(p,s=100)=>`<div class="av" style="--s:${s}px;--f:${F[p.frame]||F.none}"><span${hasImg(p)?` style="background:center/cover url(${p.img})"`:''}>${hasImg(p)?'':AV[p.avatar]||AV[0]}</span></div>`;
const cnt=p=>Object.keys(p.badges||{}).length;
const fmt=t=>t?new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'-';
const normCode=c=>String(c).toUpperCase().replace(/[^A-Z0-9_-]/g,'');
let me=null,tmp={},codes={},cache=null,tab='badges',atab='players';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
const getCodes=async()=>codes=(await api('codes'))||{};

async function boot(){
  try{
    if(!await api('auth/david')){
      await api('auth/david','PUT',{hash:await sha('david'),email:'',role:'admin'});
      await api('profiles/david','PUT',{name:'david',avatar:0,frame:'gold',public:true,created:Date.now()});
    }
    if(!await api('codes/2026-F3DP-SUPPORTER-PROD'))
      await api('codes/2026-F3DP-SUPPORTER-PROD','PUT',{title:'F3DP Supporter',desc:'Backed Dafreta Network from the start.',icon:'🏅',rarity:'legendary'});
    if(!await api('auth/test')){
      await api('auth/test','PUT',{hash:await sha('test'),email:'test@example.com',role:'player'});
      await api('profiles/test','PUT',{name:'test',avatar:1,frame:'neon',public:true,created:Date.now(),badges:{'2026-F3DP-SUPPORTER-PROD':Date.now()}});
    }
    const s=JSON.parse(localStorage.dn_s||'null');
    if(s){const a=await api('auth/'+s.u);if(a&&a.hash===s.h)me={k:s.u,role:a.role,email:a.email||''}}
  }catch(e){return $('#app').innerHTML=`<div class="msg">${esc(e.message)}</div>`}
  nav();route();
}
function nav(){setTimeout(watch,0);
  $('#nl').innerHTML='<a class="l" href="#/shop">Shop</a>'+(me?`<a class="l" href="#/me">My account</a>${me.role==='admin'?`<a class="l" href="#/admin" onclick="atab=pend?'orders':atab">Admin${pend?`<b class="dot">${pend}</b>`:''}</a>`:''}<a class="l" href="#/char/${me.k}">My page</a><button class="g s" onclick="logout()">Log out</button>`
  :`<a class="l" href="#/login">Log in</a><button class="s" onclick="location.hash='#/register'">Create account</button>`)}
function logout(){localStorage.removeItem('dn_s');me=null;nav();location.hash='#/'; route()}
const view=h=>{$('#app').innerHTML=h;window.scrollTo(0,0)};
async function route(){
  const [,pg,arg,arg2]=location.hash.split('/');
  try{
    if(pg==='login')return loginV();
    if(pg==='register')return regV();
    if(pg==='shop')return shopV();
    if(pg==='char')return charV((arg||'').toLowerCase());
    if(pg==='me')return me?meV():loginV();
    if(pg==='admin')return me&&me.role==='admin'?(arg==='user'?editV(arg2):adminV()):view('<div class="msg">Admins only.</div>');
    homeV();
  }catch(e){view(`<div class="msg">${esc(e.message)}</div>`)}
}
window.onhashchange=route;

/* ---------- search ---------- */
let st;
function search(v){clearTimeout(st);const box=$('#sr');v=v.trim().toLowerCase();if(!v){box.style.display='none';return}
  st=setTimeout(async()=>{
    cache=cache||await api('profiles')||{};
    const r=Object.entries(cache).filter(([k,p])=>(p.public||(me&&me.role==='admin'))&&k.includes(v)).slice(0,6);
    box.innerHTML=r.length?r.map(([k,p])=>`<a href="#/char/${k}" onclick="$('#sr').style.display='none'">${av(p,32)}<span>${esc(p.name)}</span></a>`).join(''):'<a class="mut">No public players found</a>';
    box.style.display='block'},250)}
document.addEventListener('click',e=>{if(!e.target.closest('.sw'))$('#sr').style.display='none'});

/* ---------- pages ---------- */
async function homeV(){
  const pr=Object.values(await api('profiles')||{}).filter(p=>p.public).sort((a,b)=>cnt(b)-cnt(a)).slice(0,11);
  const you=me?(await api('profiles/'+me.k)||{}):{avatar:0,frame:'gold'};
  const lk=p=>'#/char/'+p.name.toLowerCase(),top=pr.slice(0,3),rest=pr.slice(3);
  view(`<section class="heroW"><canvas id="pt"></canvas><div class="hero"><div><h1>Your name.<br>Your <em>badges.</em></h1>
  <p>Create a character, redeem codes from events and supporters, and show off every badge on your public page. Games are on the way.</p>
  <div class="row">${me?`<button onclick="location.hash='#/char/${me.k}'">View my page</button>`:`<button onclick="location.hash='#/register'">Create account</button><button class="g" onclick="location.hash='#/login'">Log in</button>`}<button class="g" onclick="location.hash='#/shop'">Visit shop</button></div></div>
  <div style="display:grid;place-items:center">${av(you,220)}</div></div></section>
  <div class="sec-h"><h2>Top collectors</h2><span class="mut">Most badges earned</span></div>
  ${pr.length?'':'<p class="mut">No public players yet.</p>'}
  <div class="pod">${top.map((p,i)=>`<a class="pc r${i+1}" href="${lk(p)}"><span class="rk">${i+1}</span>${av(p,i?112:148)}<b>${esc(p.name)}</b><span class="mut">${cnt(p)} badges</span></a>`).join('')}</div>
  <div class="cols">${rest.map(p=>`<a class="pl" href="${lk(p)}">${av(p,56)}<div><b>${esc(p.name)}</b><span>${cnt(p)} badges</span></div></a>`).join('')}</div>`);
  particles();
}
function loginV(){
  view(`<div class="auth box"><h2>Log in</h2><div id="m"></div>
  <label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password" onkeydown="event.key==='Enter'&&doLogin()">
  <div class="row" style="margin-top:18px"><button onclick="doLogin()">Log in</button><button class="g" onclick="location.hash='#/register'">Create account</button></div></div>`);
}
async function doLogin(){
  const k=$('#u').value.trim().toLowerCase(),h=await sha($('#p').value);
  try{const a=k&&await api('auth/'+k);
    if(!a||a.hash!==h)return $('#m').innerHTML='<div class="msg">Wrong username or password.</div>';
    localStorage.dn_s=JSON.stringify({u:k,h});me={k,role:a.role,email:a.email||''};nav();location.hash==='#/'?route():location.hash='#/';
  }catch(e){$('#m').innerHTML=`<div class="msg">${esc(e.message)}</div>`}
}
function regV(){
  view(`<div class="auth box"><h2>Create account</h2><div id="m"></div>
  <label>Username (3-16 letters, numbers, _)</label><input id="u" autocomplete="username"><label>Email</label><input id="e" type="email">
  <label>Password</label><input id="p" type="password" autocomplete="new-password"><label>Confirm password</label><input id="p2" type="password">
  <div class="tg"><input id="pub" type="checkbox" checked><span>Let other players find my page</span></div>
  <button onclick="doReg()">Create account</button></div>`);
}
async function doReg(){
  const n=$('#u').value.trim(),k=n.toLowerCase(),e=$('#e').value.trim(),p=$('#p').value,m=$('#m');
  const bad=t=>m.innerHTML=`<div class="msg">${t}</div>`;
  if(!/^[a-z0-9_]{3,16}$/.test(k))return bad('Username must be 3-16 letters, numbers or underscores.');
  if(!/^\S+@\S+\.\S+$/.test(e))return bad('Enter a valid email.');
  if(p.length<4)return bad('Password needs at least 4 characters.');
  if(p!==$('#p2').value)return bad('Passwords do not match.');
  try{if(await api('auth/'+k))return bad('That username is taken.');
    const h=await sha(p);
    await api('auth/'+k,'PUT',{hash:h,email:e,role:'player'});
    await api('profiles/'+k,'PUT',{name:n,avatar:Math.floor(Math.random()*AV.length),frame:'none',public:$('#pub').checked,created:Date.now()});
    cache=null;localStorage.dn_s=JSON.stringify({u:k,h});me={k,role:'player',email:e};nav();location.hash='#/me';
  }catch(x){bad(esc(x.message))}
}
async function charV(k){
  const p=k&&await api('profiles/'+k);
  if(!p||(!p.public&&!(me&&(me.k===k||me.role==='admin'))))return view('<div class="box auth"><h2>Player not found</h2><p class="mut">This player does not exist or keeps their page private.</p></div>');
  await getCodes();
  const own=me&&(me.k===k);
  const by={};Object.keys(p.badges||{}).forEach(c=>{const r=(codes[c]||{}).rarity||'common';by[r]=(by[r]||0)+1});
  view(`<div class="char"><div class="box side">${av(p,170)}<h2>${esc(p.name)}</h2>${p.public?'':'<p class="mut">Private page</p>'}
  <div class="stat"><span>Badges</span><b>${cnt(p)}</b></div><div class="stat"><span>Legendary</span><b>${by.legendary||0}</b></div>
  <div class="stat"><span>Epic</span><b>${by.epic||0}</b></div><div class="stat"><span>Joined</span><b>${fmt(p.created)}</b></div>

function badgeGrid(p,codes,rm,k){
  const e=Object.entries(p.badges||{}).sort((a,b)=>b[1]-a[1]);
  if(!e.length)return '<p class="mut" style="margin-top:10px">No badges yet. Redeem a code to earn your first.</p>';
  return `<div class="bg">${e.map(([c,t])=>{const d=codes[c]||{title:c,icon:'🎖️',rarity:'common',desc:''};
  return `<div class="bd" style="--rc:${RC[d.rarity]||RC.common}">${rm?`<button class="d x" onclick="rmBadge('${k}','${c}')">x</button>`:''}<i>${esc(d.icon)}</i><b>${esc(d.title)}</b><em>${esc(d.rarity)}</em><small>${esc(d.desc)}</small><small>${fmt(t)}</small></div>`}).join('')}</div>`;

/* ---------- avatar picker ---------- */
function picker(p){
  tmp={avatar:p.avatar||0,frame:p.frame||'none',img:p.img||''};
  setTimeout(paint,0);
  return `<div class="pk"><div id="prev"></div><div><h4>Character</h4><div class="grid" id="avg">${AV.map((e,i)=>`<button class="ch" data-i="${i}" onclick="pick('avatar',${i})">${e}</button>`).join('')}</div>
  <div class="row" style="margin-bottom:14px"><button class="s" onclick="$('#af').click()">Upload my own image</button><button class="g s" onclick="pick('img','')">Remove image</button></div>
  <input id="af" type="file" accept="image/*" hidden onchange="upImg(this)">
  <h4>Frame</h4><div class="grid" id="frg">${Object.keys(F).map(k=>`<button class="ch fb" style="--f:${F[k]}" title="${k}" data-k="${k}" onclick="pick('frame','${k}')"></button>`).join('')}</div></div></div>`;
}
const pick=(t,v)=>{tmp[t]=v;if(t==='avatar')tmp.img='';paint()};
function paint(){$('#prev').innerHTML=av(tmp,150);
  document.querySelectorAll('#avg .ch').forEach(b=>b.classList.toggle('sel',!tmp.img&&+b.dataset.i===tmp.avatar));
  document.querySelectorAll('#frg .ch').forEach(b=>b.classList.toggle('sel',b.dataset.k===tmp.frame))}
const shrink=(f,max,q,sq)=>new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const c=document.createElement('canvas'),g=c.getContext('2d');let w=im.width,h=im.height;
    if(sq){const m=Math.min(w,h);c.width=c.height=max;g.drawImage(im,(w-m)/2,(h-m)/2,m,m,0,0,max,max)}
    else{const k=Math.min(1,max/Math.max(w,h));c.width=Math.round(w*k);c.height=Math.round(h*k);g.drawImage(im,0,0,c.width,c.height)}
    URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>no(new Error('Could not read that image.'));im.src=u});
async function upImg(i){const f=i.files[0];if(!f)return;try{tmp.img=await shrink(f,192,.85,true);paint()}catch(e){toast(e.message)}}

   <div class="row" style="margin:10px 0 22px"><input id="cd" style="max-width:380px" placeholder="Enter badge code" onkeydown="event.key==='Enter'&&redeem()"><button onclick="redeem()">Add badge</button></div>

  if(tab==='sec')body=`<div id="m"></div><div style="max-width:380px"><h3>Email</h3><label>Current: ${esc(me.email||'none')}</label><input id="ne" type="email" placeholder="New email"><div style="margin-top:10px"><button onclick="chEmail()">Change email</button></div>

    await api(`profiles/${me.k}/badges/${c}`,'PUT',Date.now());cache=null;toast('Badge added: '+d.title);meV();

async function saveChar(){await api('profiles/'+me.k,'PATCH',{avatar:tmp.avatar,frame:tmp.frame,img:tmp.img||null,public:$('#pub').checked});cache=null;toast('Character saved')}
async function chEmail(){const e=$('#ne').value.trim();if(!/^\S+@\S+\.\S+$/.test(e))return $('#m').innerHTML='<div class="msg">Enter a valid email.</div>';
  await api('auth/'+me.k,'PATCH',{email:e});me.email=e;toast('Email changed');meV()}
async function chPass(){

/* ---------- particles ---------- */
function particles(){
  const c=$('#pt');if(!c)return;const x=c.getContext('2d');let W,H,P=[];
  const mk=i=>({x:Math.random()*W,y:i?Math.random()*H:H+10,r:Math.random()*2.2+.6,v:Math.random()*.6+.2,d:Math.random()*6,g:Math.random()<.35});
  const rs=()=>{W=c.width=c.offsetWidth;H=c.height=c.offsetHeight;P=Array.from({length:Math.min(90,W/11|0)},()=>mk(true))};
  rs();new ResizeObserver(rs).observe(c);
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  (function f(){
    if(!c.isConnected)return;x.clearRect(0,0,W,H);
    for(const p of P){
      if(!still){p.y-=p.v;p.x+=Math.sin(p.y/40+p.d)*.4;if(p.y<-10)Object.assign(p,mk(false))}
      x.shadowBlur=0;
      for(const q of P){const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<100){x.strokeStyle=`rgba(80,150,255,${.18*(1-d/100)})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}
      x.fillStyle=p.g?'rgba(245,179,53,.9)':'rgba(100,170,255,.8)';x.shadowBlur=12;x.shadowColor=x.fillStyle;
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill();
    }
    if(!still)requestAnimationFrame(f)})();
}
/* ---------- shop ---------- */
const PRODUCTS=[{name:'Test Product',price:100,icon:'🎁',desc:'Placeholder item for testing the checkout flow.',details:['Delivered within 24 hours after your payment is verified','Sent to your email or by SMS','Message us if anything looks wrong']}];
const IMG='https://raw.githubusercontent.com/DafretaNetwork/DafretaNetworkHub/refs/heads/main/assets/image/payments/';
const PAY={gcash:{n:'GCash',img:IMG+'gcash.png',acct:'GCash number: 09XX XXX XXXX (account name here)'},maya:{n:'Maya',img:IMG+'maya.png',acct:'Maya number: 09XX XXX XXXX (account name here)'}};
const peso=n=>'₱'+Number(n).toLocaleString();
let od={};
function shopV(){view(`<div class="sec-h"><h2>Shop</h2><span class="mut">Pay with GCash or Maya</span></div><div class="shop">${PRODUCTS.map((p,i)=>`<div class="pr" tabindex="0" onclick="buy(${i})" onkeydown="event.key==='Enter'&&buy(${i})"><div class="im">${p.icon}</div><div class="tx"><b>${esc(p.name)}</b><p class="mut">${esc(p.desc)}</p><span>${peso(p.price)}</span></div></div>`).join('')}</div>`)}
function modal(h){let o=$('#ov');if(!o){o=document.createElement('div');o.id='ov';o.className='ov';o.onmousedown=e=>{if(e.target===o)closeM()};document.body.appendChild(o)}
  o.innerHTML=`<div class="md"><button class="xx" onclick="closeM()" aria-label="Close">✕</button>${h}</div>`}
const closeM=()=>{const o=$('#ov');o&&o.remove()};
function buy(i){od={i};const p=PRODUCTS[i];
  modal(`<div style="display:flex;gap:16px;align-items:center;margin-bottom:14px;padding-right:30px"><div class="im" style="width:84px;height:84px;border-radius:18px;font-size:42px">${p.icon}</div><div><div class="mt">${esc(p.name)}</div><b style="font-size:20px">${peso(p.price)}</b></div></div>
  <p class="mut">${esc(p.desc)}</p><ul class="mut" style="margin:10px 0 6px 18px">${p.details.map(d=>`<li>${esc(d)}</li>`).join('')}</ul><div id="m"></div>
  <div class="f2"><div><label>First name</label><input id="fn" autocomplete="given-name"></div><div><label>Last name</label><input id="ln" autocomplete="family-name"></div></div>
  <label>Email</label><input id="em" type="email" value="${esc(me?me.email:'')}"><label>Phone number</label><input id="ph" type="tel" placeholder="09XX XXX XXXX">
  <label>Choose payment method</label><div class="pay">${Object.entries(PAY).map(([k,v])=>`<button class="pm" onclick="pickPay('${k}')" aria-label="${v.n}"><img src="${v.img}" alt="${v.n}"></button>`).join('')}</div>`)}
function pickPay(k){
  const v=id=>$(id).value.trim(),f={first:v('#fn'),last:v('#ln'),email:v('#em'),phone:v('#ph')},bad=t=>$('#m').innerHTML=`<div class="msg">${t}</div>`;
  if(!f.first||!f.last)return bad('Enter your first and last name.');
  if(!/^\S+@\S+\.\S+$/.test(f.email))return bad('Enter a valid email.');
  if(f.phone.replace(/\D/g,'').length<10)return bad('Enter a valid phone number.');
  Object.assign(od,f,{method:k});const p=PRODUCTS[od.i];
  modal(`<div class="mt">Upload proof of payment</div><p class="mut" style="margin:6px 0 14px">Pay ${peso(p.price)} with ${PAY[k].n}, then upload a screenshot of your receipt. We check it as soon as it arrives.</p>
  <div class="acct"><img src="${PAY[k].img}" alt=""><span>${esc(PAY[k].acct)}</span></div><div id="m"></div>
  <div class="drop" id="dz" onclick="$('#pf').click()"><div style="font-size:34px">📤</div>Click to upload your screenshot<br><small>PNG or JPG</small></div>
  <input id="pf" type="file" accept="image/*" hidden onchange="sendProof(this)"><div style="margin-top:14px"><button class="g s" onclick="buy(od.i)">Back</button></div>`)}
async function sendProof(i){
  const f=i.files[0];if(!f)return;const dz=$('#dz');dz.textContent='Uploading...';
  try{const proof=await shrink(f,1000,.72),p=PRODUCTS[od.i];
    await api('orders','POST',{product:p.name,price:p.price,method:od.method,first:od.first,last:od.last,email:od.email,phone:od.phone,user:me?me.k:'guest',proof,created:Date.now()});
    modal(`<div class="done"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="25"/><path d="M14 27l8 8 16-17"/></svg><div class="mt" style="margin-top:12px">Payment submitted</div>
    <p class="mut" style="margin:8px 0 20px">Please wait patiently. An email or personal message via SMS will be sent to you within 24 hours for completion.</p><button onclick="closeM()">Done</button></div>`);
  }catch(e){dz.textContent='Click to upload your screenshot';$('#m').innerHTML=`<div class="msg">${esc(e.message)}</div>`}}
/* ---------- admin payments + notifications ---------- */
let pend=0,wt=0,seen=-1,ORD={};
async function chk(){try{const o=await (await fetch(DB+'/orders.json?shallow=true')).json(),n=o?Object.keys(o).length:0;
  if(n>seen&&n>0)toast(`${n} payment${n>1?'s':''} waiting for review`);const ch=n!==pend;pend=n;seen=n;if(ch)nav()}catch(e){}}
function watch(){if(me&&me.role==='admin'){if(!wt){wt=setInterval(chk,30000);chk()}}else if(wt){clearInterval(wt);wt=0;pend=0;seen=-1}}
async function ordersHTML(){
  ORD=await api('orders')||{};const e=Object.entries(ORD).sort((a,b)=>b[1].created-a[1].created);pend=e.length;seen=pend;
  if(!e.length)return '<p class="mut">No payments waiting.</p>';
  return `<table><tr><th>Date</th><th>Customer</th><th>Contact</th><th>Order</th><th>Proof</th><th></th></tr>${e.map(([id,r])=>`<tr><td>${new Date(r.created).toLocaleString()}</td><td>${esc(r.first)} ${esc(r.last)}<br><span class="mut">${esc(r.user)}</span></td><td>${esc(r.email)}<br>${esc(r.phone)}</td><td>${esc(r.product)}<br>${peso(r.price)} via ${esc(r.method)}</td><td><img class="pf" src="${esc(r.proof)}" alt="Proof" onclick="showProof('${id}')"></td><td><button class="d s" onclick="delOrder('${id}')">Delete</button></td></tr>`).join('')}</table>`}
const showProof=id=>modal(`<img src="${esc(ORD[id].proof)}" alt="Proof of payment" style="width:100%;border-radius:14px;margin-top:20px">`);
async function delOrder(id){if(!confirm('Delete this payment record from the database?'))return;await api('orders/'+id,'DELETE');pend=Math.max(0,pend-1);seen=pend;nav();adminV()}
boot();
