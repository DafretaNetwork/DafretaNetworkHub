<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060d">
<title>Dafreta Network</title>
<link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/DafretaNetwork/DafretaNetworkHub/refs/heads/main/aseets/image/logo/dafreta-network-favicon.webp">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#08101c;--panel2:#0c1727;--line:#1d3350;--ink:#e6edf7;--mute:#7f93ad;--gold:#f5b335;--blue:#3b8bff;--red:#ff5468;--ok:#47d18c}
*{box-sizing:border-box;margin:0}
body{background:#000;color:var(--ink);font:500 16px/1.5 Barlow,system-ui,sans-serif;min-height:100vh;
background-image:radial-gradient(ellipse 70% 40% at 50% -10%,#0d2447 0,transparent 70%)}
h1,h2,h3,h4,.logo,button,.tab{font-family:'Chakra Petch',Barlow,sans-serif}
a{color:var(--blue);text-decoration:none}
nav{display:flex;align-items:center;gap:18px;padding:12px 24px;border-bottom:1px solid var(--line);background:#000c;position:sticky;top:0;z-index:20;backdrop-filter:blur(6px);flex-wrap:wrap}
.logo{font-weight:700;font-size:22px;color:var(--gold);letter-spacing:.5px;cursor:pointer}
.logo small{color:var(--ink);font-weight:500}
nav .sp{flex:1}
#nl{align-items:center}
nav a.l{color:var(--ink);padding:6px 4px;border-bottom:2px solid transparent}
nav a.l:hover{border-color:var(--gold)}
.sw{position:relative;width:240px}
.sw input{width:100%}
#sr{position:absolute;top:44px;left:0;right:0;background:var(--panel2);border:1px solid var(--line);display:none}
#sr a{display:flex;gap:10px;align-items:center;padding:8px 10px;color:var(--ink)}
#sr a:hover{background:#12223a}
main{max-width:1080px;margin:0 auto;padding:30px 20px 80px}
input,select,textarea{background:#050b14;border:1px solid var(--line);color:var(--ink);padding:10px 12px;font:inherit;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label{display:block;color:var(--mute);font-size:14px;margin:12px 0 4px}
button{cursor:pointer;border:0;background:var(--gold);color:#201400;font-weight:700;font-size:15px;padding:10px 20px;
clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
button:hover{filter:brightness(1.12)}
button:disabled{opacity:.5;cursor:default}
button.g{background:#14243c;color:var(--ink)}
button.d{background:var(--red);color:#fff}
button.s{padding:5px 12px;font-size:13px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.box{background:var(--panel);border:1px solid var(--line);padding:22px;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;padding:30px 0 40px}
.hero h1{font-size:clamp(38px,6vw,68px);line-height:1;color:#fff}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{color:var(--mute);margin:16px 0 22px;max-width:46ch}
.row{display:flex;gap:10px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pl{display:flex;gap:12px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.pl:hover{border-color:var(--gold)}
.pl b{display:block}.pl span{color:var(--mute);font-size:13px}
.av{--s:100px;width:var(--s);height:var(--s);padding:calc(var(--s)*.05);background:var(--f);flex:none;display:grid;
clip-path:polygon(14% 0,100% 0,100% 86%,86% 100%,0 100%,0 14%)}
.av span{display:grid;place-items:center;font-size:calc(var(--s)*.55);background:radial-gradient(circle at 50% 35%,#223a5c,#050a12);
clip-path:polygon(14% 0,100% 0,100% 86%,86% 100%,0 100%,0 14%)}
.char{display:grid;grid-template-columns:300px 1fr;gap:20px}
.char .side{text-align:center}
.char .side .av{margin:6px auto 14px}
.char h2{font-size:28px;color:var(--gold)}
.stat{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0;color:var(--mute);text-align:left}
.stat b{color:var(--ink)}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
.bd{background:var(--panel2);border:0;border-radius:22px;padding:18px 10px 16px;text-align:center;position:relative}
.bd b{display:block;font:700 16px/1.2 'Chakra Petch',sans-serif;letter-spacing:.3px;margin-top:12px;text-wrap:balance;overflow-wrap:anywhere}
.bd small{display:block;color:var(--mute);font-size:12.5px;line-height:1.3;margin-top:3px}
.bd em{display:block;font-style:normal;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--rc);margin-top:4px}
.bd .x{position:absolute;top:8px;right:8px;padding:1px 7px;font-size:12px;z-index:2}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:10px 18px;cursor:pointer;color:var(--mute)}
.tab.on{color:var(--gold);border-bottom:2px solid var(--gold)}
.pk{display:flex;gap:24px;flex-wrap:wrap}
.grid{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;max-width:430px}
.ch{width:46px;height:46px;padding:0;font-size:24px;background:#0a1626;border:1px solid var(--line);clip-path:none;display:grid;place-items:center}
.ch.fb{background:var(--f)}
.ch.sel{border-color:var(--gold);outline:2px solid var(--gold)}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mute);font-weight:500;font-size:14px}
td,th{padding:9px 8px;border-bottom:1px solid var(--line)}
.tg{display:flex;align-items:center;gap:8px;margin:14px 0}.tg input{width:auto}
.msg{padding:10px 14px;margin:10px 0;border-left:3px solid var(--red);background:#1a0a10}
.msg.ok{border-color:var(--ok);background:#08170f}
#toast{position:fixed;bottom:96px;right:20px;background:var(--panel2);border:1px solid var(--gold);padding:12px 18px;display:none;z-index:70;cursor:pointer;max-width:min(340px,calc(100vw - 40px))}
.auth{max-width:400px;margin:30px auto}
.mut{color:var(--mute)}
@media(max-width:760px){.hero,.char{grid-template-columns:1fr}.sw{width:140px}nav{gap:10px;padding:10px 12px}}
@media(prefers-reduced-motion:no-preference){.hero .av{animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}}

.logo img{height:38px;display:block}
.dot{background:var(--red);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px;margin-left:5px}
.heroW{position:relative;overflow:hidden;border-block:1px solid var(--line);width:100vw;margin:-30px 0 50px calc(50% - 50vw);padding:70px max(24px,calc(50vw - 520px));min-height:520px;display:flex;align-items:center;
background:radial-gradient(ellipse 55% 80% at 82% 50%,#10305f99,transparent 70%),#02060d}
#pt{position:absolute;inset:0;width:100%;height:100%}
.heroW .hero{position:relative;width:100%;padding:0}
.hero h1{font-size:clamp(46px,8vw,96px);text-shadow:0 0 40px #3b8bff66}
.hero h1 em{text-shadow:0 0 30px #f5b335aa}
.hero .av{filter:drop-shadow(0 0 28px #f5b33588)}
.sec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}.sec-h h2{font-size:36px}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:end;margin-bottom:16px}
.pc{text-align:center;padding:26px 12px 20px;background:linear-gradient(180deg,#0f2038,#050a12);border:1px solid var(--rk);color:var(--ink);position:relative;display:block;box-shadow:0 0 30px -8px var(--rk);transition:transform .2s}
.pc:hover{transform:translateY(-5px)}
.pc.r1{--rk:#f5b335;padding-top:46px;padding-bottom:34px;order:2;box-shadow:0 0 50px -6px var(--rk)}
.pc.r2{--rk:#c9d3e0;order:1}.pc.r3{--rk:#d98a3d;order:3}
.pc .rk{position:absolute;top:8px;left:14px;font:700 30px 'Chakra Petch';color:var(--rk)}
.pc .av{margin:0 auto}.pc b{display:block;font:700 21px 'Chakra Petch';margin-top:12px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pr{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .2s}
.pr:hover{border-color:var(--gold);transform:translateY(-4px)}
.pr.so{opacity:.6}
.im{display:grid;place-items:center;background:radial-gradient(circle,#173560,#050a12)}
.pr .im{height:180px;font-size:76px;overflow:hidden}
.pr .im img{width:100%;height:100%;object-fit:cover;display:block}
.pr .tx{padding:14px 18px 18px}.pr .tx b{font:700 19px 'Chakra Petch';display:block}.pr .tx .px{color:var(--ok);font-weight:700;font-size:18px}
.pr .tx em{font-style:normal;float:right;font-size:13px;margin-top:5px;font-weight:600}
.pr .tx em.okk{color:var(--ok)}.pr .tx em.low{color:var(--gold)}.pr .tx em.out{color:var(--red)}
.cl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0 8px}
.cl4{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ov{position:fixed;inset:0;background:#000a;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:60;display:grid;place-items:center;padding:16px;overflow:auto}
.md{background:#0a1220;border:1px solid var(--line);border-radius:26px;width:min(520px,100%);max-height:94vh;overflow:auto;padding:28px;box-shadow:0 30px 90px #000;position:relative}
.md .xx{position:absolute;top:14px;right:14px;width:34px;height:34px;padding:0;border-radius:50%;background:#14243c;color:var(--ink);clip-path:none;z-index:3}
.md input{border-radius:12px}
.mt{font:700 26px 'Chakra Petch';color:var(--gold)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.pm{background:#fff;border-radius:16px;height:76px;display:grid;place-items:center;padding:10px;clip-path:none;border:2px solid transparent}
.pm:hover{border-color:var(--gold)}.pm img{max-height:48px;max-width:100%}
.drop{border:2px dashed var(--line);border-radius:16px;padding:30px 14px;text-align:center;cursor:pointer;color:var(--mute)}
.drop:hover{border-color:var(--gold)}
.acct{background:#050b14;border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center}
.acct img{height:30px;background:#fff;border-radius:8px;padding:3px 6px}
.done{text-align:center;padding:8px 0}.done svg{width:100px;height:100px}
.done circle{stroke:var(--ok);stroke-width:3;fill:none;stroke-dasharray:158;stroke-dashoffset:158;animation:st .7s ease forwards}
.done path{stroke:var(--ok);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:48;stroke-dashoffset:48;animation:st .4s .6s ease forwards}
@keyframes st{to{stroke-dashoffset:0}}
.pf{width:90px;border-radius:8px;cursor:pointer;display:block}
@media(max-width:760px){.pod{grid-template-columns:1fr}.pc{order:0!important}.heroW{padding:36px 20px}.f2,.pay{grid-template-columns:1fr}}
.pm{display:flex;gap:10px;align-items:center;justify-content:center;font:700 24px 'Chakra Petch';color:#fff}
.pm .lg{font-style:normal;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:21px}
.pm.gcash{background:#0b6cf0}.pm.gcash .lg{background:#fff;color:#0b6cf0}
.pm.maya{background:#050505;color:#2ee27d;border-color:#1f6b45}.pm.maya .lg{background:#2ee27d;color:#000}
.qr img{display:block;max-width:100%;max-height:340px;margin:8px auto 18px;border-radius:16px;background:#fff}
body{overflow-x:hidden}#shop,#news{scroll-margin-top:72px}

/* ---------- logout button pop + close button spin ---------- */
button.lo{transition:transform .25s cubic-bezier(.34,1.8,.5,1),background .25s,color .25s}
button.lo:hover{transform:scale(1.15) translateY(-2px);background:var(--red);color:#fff;filter:none}
button.lo:active{transform:scale(.93)}
.md .xx,.bd .x{transition:transform .5s ease,background .25s,color .25s}
.md .xx:hover,.bd .x:hover{transform:rotate(360deg);background:var(--red);color:#fff;filter:none}
.md .xx:hover{box-shadow:0 0 14px #ff546899}

/* ---------- badges + glow ---------- */
.bd{cursor:pointer;transition:transform .2s}
.bd:hover{transform:translateY(-3px);box-shadow:0 8px 26px -10px var(--rc)}
.bi{--bs:64px;position:relative;isolation:isolate;width:var(--bs);height:var(--bs);margin:0 auto 6px;display:grid;place-items:center;font-size:calc(var(--bs)*.6)}
.bi img{width:100%;height:100%;object-fit:contain;position:relative}
.bi.gl::before{content:'';position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,var(--rc) 0,transparent 70%);filter:blur(7px);z-index:-1;opacity:.8}
.bi.gl img{filter:drop-shadow(0 0 5px var(--rc))}
@media(prefers-reduced-motion:no-preference){.bi.gl::before{animation:glow 2.2s ease-in-out infinite}}
@keyframes glow{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
.bx2{background:var(--panel2);border:1px solid var(--line);padding:14px;margin-bottom:14px}
.bx2 table{margin-top:12px}
code{font:600 14px monospace;letter-spacing:1px;color:var(--gold)}
textarea{resize:vertical;min-height:90px}

/* ---------- news ---------- */
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.nw{background:var(--panel);border:1px solid var(--line);padding:20px 22px;cursor:pointer;transition:border-color .2s,transform .2s;
clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.nw:hover{border-color:var(--gold);transform:translateY(-3px)}
.nw small{display:block;margin-bottom:6px;font-size:13px}
.nw h3{font:700 26px/1.15 'Chakra Petch',sans-serif;color:#fff;overflow-wrap:anywhere}
.nw h4{font:600 17px/1.3 Barlow,sans-serif;color:var(--gold);margin:6px 0 10px;overflow-wrap:anywhere}
.nw p{font-size:14.5px;color:#aebcd0;overflow-wrap:anywhere;white-space:pre-wrap}

/* ---------- product gallery ---------- */
.gm{display:block;width:100%;max-height:280px;object-fit:contain;background:#050a12;border-radius:16px}
.gts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.gt{width:56px;height:56px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer;opacity:.75}
.gt.on{border-color:var(--gold);opacity:1}

/* ---------- friends ---------- */
.fr-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fr-row:last-child{border-bottom:0}
.fh{display:flex;align-items:center;gap:10px;margin:22px 0 6px}.fh:first-child{margin-top:0}
.fh h3{font-size:20px}
.cnt{background:#14243c;border-radius:99px;font-size:12px;padding:1px 9px;color:var(--mute)}

/* ---------- chat widget ---------- */
.cbw{position:fixed;right:20px;bottom:20px;z-index:40;width:62px;height:62px;display:grid;place-items:center;
animation:cbob 3.4s ease-in-out infinite,cglow 2.6s ease-in-out infinite}
.cbw.has{animation-duration:1.6s,1.2s}
@keyframes cbob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.07)}}
@keyframes cglow{0%,100%{filter:drop-shadow(0 0 4px #f5b33555)}50%{filter:drop-shadow(0 0 20px #f5b335d0)}}
@media(prefers-reduced-motion:reduce){.cbw{animation:none}}
#cb{width:60px;height:60px;padding:0;font-size:27px;display:grid;place-items:center;
clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.cbd{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:99px;background:var(--red);color:#fff;font:700 12px/22px 'Chakra Petch';text-align:center;padding:0 5px}
.cbd[hidden]{display:none}
#cp{position:fixed;right:20px;bottom:100px;width:min(370px,calc(100vw - 24px));height:min(520px,calc(100vh - 130px));background:var(--panel);border:1px solid var(--line);z-index:45;display:none;flex-direction:column;
clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);background-image:radial-gradient(ellipse 80% 30% at 50% 0,#0d2447 0,transparent 80%)}
.cx-h{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 20px;border-bottom:1px solid var(--line)}
.cx-h b{flex:1;font:700 18px 'Chakra Petch';color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-b{flex:1;overflow-y:auto}
.cx-i{display:flex;gap:12px;align-items:center;padding:10px 16px;cursor:pointer;border-bottom:1px solid #112238}
.cx-i:hover,.cx-i:focus-visible{background:#0e1c30}
.cx-i small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-i b{display:block}
.ud{width:11px;height:11px;border-radius:50%;background:var(--red);flex:none;box-shadow:0 0 8px var(--red)}
.cx-m{display:flex;flex-direction:column;gap:8px;padding:12px}
.mb{max-width:80%;padding:8px 12px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:14px}
.mb small{display:block;font-size:11px;opacity:.6;margin-top:2px}
.mb.me{align-self:flex-end;background:#3a2a07;border:1px solid #6b4d10;border-bottom-right-radius:4px}
.mb.th{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.cx-f{display:flex;gap:8px;padding:10px 12px 18px;border-top:1px solid var(--line)}
.cx-f input{border-radius:10px}
@media(max-width:760px){.cbw{right:12px;bottom:12px}#cp{right:12px;bottom:88px}#toast{right:12px}}

/* ---------- v3 additions ---------- */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#050b14}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#f5b335,#b8780a);border-radius:99px;border:2px solid #050b14}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#ffd067,#f5b335)}
::-webkit-scrollbar-corner{background:transparent}
.md::-webkit-scrollbar-track{background:transparent;margin:24px 0}
.md::-webkit-scrollbar-thumb{border:3px solid #0a1220}
.cx-b::-webkit-scrollbar{width:8px}
.cx-b::-webkit-scrollbar-track{background:transparent}
.cx-b::-webkit-scrollbar-thumb{border:2px solid var(--panel)}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:#f5b335 #08101c}}
.md{width:min(var(--mw,520px),100%)}
/* close buttons */
button.xr,.md .xx,.bd .x{background:#FF2400;color:#fff}
.md .xx:hover,.bd .x:hover,button.xr:hover{background:#ff4a24;color:#fff;filter:none;box-shadow:0 0 16px #FF2400aa}
/* chat button: smooth float + soft breathing glow */
.cbw{right:22px;bottom:22px;animation:cbob 3.6s cubic-bezier(.45,0,.55,1) infinite;will-change:transform}
.cbw::before{content:'';position:absolute;inset:-28px;border-radius:50%;background:radial-gradient(circle,#f5b335b0 0,#f5b33538 42%,transparent 70%);filter:blur(7px);animation:cbreath 3.6s cubic-bezier(.45,0,.55,1) infinite;pointer-events:none}
.cbw.has{animation-duration:2.2s}
.cbw.has::before{animation-duration:2.2s}
#cb{position:relative}
@keyframes cbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes cbreath{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:.95;transform:scale(1.12)}}
@media(prefers-reduced-motion:reduce){.cbw,.cbw::before{animation:none}}
/* top 3 podium: synced bounce + ribbon awards */
.pod{margin-top:92px}
.pc{animation:bnc 2.8s ease-in-out infinite}
.pc:hover{transform:scale(1.03)}
.pc.r1{--rk:#f5b335}.pc.r2{--rk:#a24dff}.pc.r3{--rk:#3b8bff}
@keyframes bnc{0%,100%{translate:0 0}50%{translate:0 -14px}}
.aw{position:relative;width:80px;height:100px;margin:-64px auto 8px;isolation:isolate}
.pc.r1 .aw{width:92px;height:115px;margin-top:-84px}
.aw svg{width:100%;height:100%;position:relative;display:block;filter:drop-shadow(0 4px 8px #000a)}
.aw::before{content:'';position:absolute;left:50%;top:34%;width:190%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;z-index:-1;
background:repeating-conic-gradient(from 0deg,var(--ac) 0 9deg,transparent 9deg 30deg);
-webkit-mask:radial-gradient(circle,#000 22%,transparent 66%);mask:radial-gradient(circle,#000 22%,transparent 66%);opacity:.6;animation:awspin 9s linear infinite}
.aw::after{content:'';position:absolute;left:50%;top:34%;width:140%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;z-index:-1;

.frb:hover{filter:none;scale:1.04}.frb:active{scale:.96}
@media(prefers-reduced-motion:reduce){.frb{animation:none}}
/* ---------- particle background (my account + my page) ---------- */
.pgbg{position:fixed;inset:0;z-index:0;pointer-events:none;
background:radial-gradient(ellipse 60% 45% at 85% 8%,#10305f66,transparent 70%),radial-gradient(ellipse 55% 45% at 8% 92%,#2a1a5a44,transparent 70%)}
.pgbg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pgw{position:relative;z-index:1}
.pgw .box{background:#08101ce6}

/* ---------- activity status, admin tab counts, footer ---------- */
.pres{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);white-space:nowrap}
.pres i{width:9px;height:9px;border-radius:50%;background:#4a5a72;flex:none}
.pres.on{color:var(--ok);font-weight:600}
.pres.on i{background:var(--ok);animation:pgl 1.8s ease-in-out infinite}
@keyframes pgl{0%,100%{box-shadow:0 0 3px var(--ok)}50%{box-shadow:0 0 11px var(--ok)}}
.prw{margin:2px 0 10px;min-height:20px}
.tn{display:inline-block;margin-left:8px;min-width:22px;padding:1px 8px;border-radius:99px;background:#14243c;color:var(--mute);font:700 12px 'Chakra Petch',sans-serif;text-align:center;transition:background .2s,color .2s}
.tab.on .tn{background:var(--gold);color:#201400}
.tn.hot{background:#FF2400;color:#fff}
.mo-only{display:none}
#ft{border-top:1px solid var(--line);background:linear-gradient(180deg,#040a14,#02060d);margin-top:20px;position:relative;z-index:1}
.ftw{max-width:1080px;margin:0 auto;padding:38px 20px 26px;display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:28px}
.ftb img{height:34px;display:block;margin-bottom:12px}
.ftb p{color:var(--mute);font-size:14px;max-width:34ch}
.ftl b{display:block;font:700 13px 'Chakra Petch',sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.ftl a{display:block;width:max-content;color:var(--mute);padding:4px 0;font-size:15px;transition:color .2s,transform .2s}
.ftl a:hover{color:var(--gold);transform:translateX(3px)}
.ftc{grid-column:1/-1;border-top:1px solid var(--line);padding-top:16px;color:var(--mute);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:760px){
#ft{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
.ftw{grid-template-columns:1fr 1fr;padding:28px 18px 16px;gap:22px}
.ftb{grid-column:1/-1}
#nl a[href="#/support"]::before{content:'🛟'}
}
/* ---- card game toggle ---- */
.cg-tog{position:relative;display:inline-block;width:52px;height:28px;flex:none;cursor:pointer}
.cg-tog input{opacity:0;width:0;height:0;position:absolute}
.cg-sl{position:absolute;inset:0;background:#14243c;border-radius:14px;transition:.3s;border:1px solid var(--line)}
.cg-sl:before{content:'';position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#7f93ad;border-radius:50%;transition:.3s}
.cg-tog input:checked+.cg-sl{background:var(--ok);border-color:var(--ok)}
.cg-tog input:checked+.cg-sl:before{transform:translateX(24px);background:#fff}

</style>
<style>

.cgc .cs{position:absolute;left:-8px;top:-8px;width:26px;height:26px;border-radius:7px;background:#fff;color:#111;font:700 14px/26px system-ui;text-align:center}
.cgc .ty{font:700 10px system-ui;letter-spacing:.08em;text-transform:uppercase;background:#0006;border-radius:99px;padding:1px 8px}
.cgc b{font:700 15px 'Chakra Petch',system-ui}.cgc .ds{font-size:12px;opacity:.95}.cgc .ic{font-size:26px;min-height:30px}
.cgc .ba{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.cgc.ult{border-color:#ffd966;box-shadow:0 0 14px #ffd96688}
</style>
</head>
<body>
<nav>
<div class="logo" onclick="location.hash='#/'"><img src="https://raw.githubusercontent.com/DafretaNetwork/DafretaNetworkHub/refs/heads/main/aseets/image/logo/dafreta-network-logo-name.webp" alt="Dafreta Network"></div>
<div class="sw"><input id="q" placeholder="Search players" autocomplete="off" oninput="search(this.value)"><div id="sr"></div></div>
<div class="sp"></div><div id="nl" class="row"></div>
<button class="sb" onclick="tgSearch()" aria-label="Search players"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
<button class="hb" id="hb" onclick="tgNav()" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
<div class="nbk" onclick="setNav(false)"></div>
</nav>
<main id="app"></main>
<footer id="ft"><div class="ftw">
<div class="ftb"><img src="https://raw.githubusercontent.com/DafretaNetwork/DafretaNetworkHub/refs/heads/main/aseets/image/logo/dafreta-network-logo-name.webp" alt="Dafreta Network"><p>Your name. Your badges. Collect, show off and connect with other players.</p></div>
<div class="ftl"><b>Explore</b><a href="#/">Home</a><a href="#/shop" onclick="return goSec('shop')">Shop</a><a href="#/news" onclick="return goSec('news')">News</a></div>
<div class="ftl"><b>Account</b><a href="#/me">My account</a><a href="#/friends">Friends</a></div>
<div class="ftl"><b>Help</b><a href="#/support" onclick="openSupport();return false">Support</a></div>
<div class="ftc"><span>&copy; <span id="fy">2026</span> Dafreta Network. All rights reserved.</span><span>Need help? Tap Support.</span></div>
</div></footer>
<div id="tb" class="tb"></div>
<div id="toast"></div>
<script>
const DB='https://dafreta-network-default-rtdb.asia-southeast1.firebasedatabase.app';
const AV=['🧙','⚔️','🏹','🐉','🦊','🤖','👹','🧛','🥷','🐺','🦅','💀','🧝','🐲','👽','🦁'];
const F={none:'#26364d',bronze:'linear-gradient(135deg,#d98a3d,#6b3d12)',silver:'linear-gradient(135deg,#fff,#7d8590)',gold:'linear-gradient(135deg,#ffe27a,#c47f00,#ffe27a)',neon:'linear-gradient(135deg,#00f0ff,#0050ff)',flame:'linear-gradient(0deg,#ff2d00,#ffb300)',rainbow:'conic-gradient(#f33,#fd3,#3f6,#3df,#35f,#f3d,#f33)',void:'linear-gradient(135deg,#fff,#111 50%,#fff)'};
const RC={common:'#7f93ad',rare:'#2f8bff',epic:'#a24dff',legendary:'#ff8a1f'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* api: path may carry a query string, e.g. 'news?orderBy=%22$key%22&limitToLast=6'. api('', 'PATCH', {...}) = multi-path update in ONE request */
const api=async(p,m='GET',b)=>{const [a,q]=p.split('?');const r=await fetch(`${DB}/${a}.json${q?'?'+q:''}`,{method:m,headers:{'Content-Type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw new Error('Database error '+r.status+'. Check your Firebase rules.');return r.json()};
const mp=o=>api('','PATCH',o);
const skeys=async p=>{const r=await fetch(`${DB}/${p}.json?shallow=true`);if(!r.ok)throw new Error('Database error '+r.status+'. Check your Firebase rules.');return Object.keys(await r.json()||{})};
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('dafreta:'+s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const mid=()=>Date.now().toString(36).padStart(9,'0')+Math.random().toString(36).slice(2,5);
const pair=(a,b)=>[a,b].sort().join('~');
const hasImg=p=>/^(data:image\/|https:\/\/raw\.githubusercontent\.com\/)/.test((p&&p.img)||'');
const FAV='https://raw.githubusercontent.com/DafretaNetwork/DafretaNetworkHub/refs/heads/main/aseets/image/logo/dafreta-network-favicon.webp';
/* system senders: announcements never show the real admin account */
const SYS={'@mod':{name:'MODERATOR',img:FAV,frame:'gold'},'@news':{name:'News',img:FAV,frame:'neon'},'@support':{name:'Support',img:FAV,frame:'neon'}};
const nm=k=>SYS[k]?SYS[k].name:k;
const gp=k=>SYS[k]?Promise.resolve(SYS[k]):getProf(k);
const ago=t=>{const s=(Date.now()-t)/1000;return s<60?'just now':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':fmt(t)};
const av=(p,s=100)=>{p=p||{};return `<div class="av" style="--s:${s}px;--f:${F[p.frame]||F.none}"><span${hasImg(p)?` style="background:center/cover url(${p.img})"`:''}>${hasImg(p)?'':AV[p.avatar]||AV[0]}</span></div>`};
const cnt=p=>Object.keys((p&&p.badges)||{}).length;
const fmt=t=>t?new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'-';
const normCode=c=>String(c).toUpperCase().replace(/[^A-Z0-9_-]/g,'');
let me=null,tmp={},codes={},bdg={},tab='badges',atab='players',CURC=null,RET='',SUPGO=false;

/* ---------- caches (keeps Firebase downloads low) ---------- */
const TTL=60000;
let PC={},PA={t:0,d:{}},SK={t:0,d:[]},NEWS={t:0,d:[]},INV={t:0,d:{}},CATS={t:0,d:{}},DC={};
const invP=k=>{if(k)delete PC[k];else PC={};PA.t=0;SK.t=0};
async function getProf(k,f){const c=PC[k];if(!f&&c&&Date.now()-c.t<300000)return c.d;const d=await api('profiles/'+k);PC[k]={t:Date.now(),d};return d}
async function allProfs(){if(Date.now()-PA.t<90000)return PA.d;const d=await api('profiles')||{};PA={t:Date.now(),d};for(const k in d)PC[k]={t:Date.now(),d:d[k]};return d}
async function profKeys(){if(Date.now()-SK.t<120000)return SK.d;SK={t:Date.now(),d:await skeys('profiles')};return SK.d}
async function getNews(){if(Date.now()-NEWS.t<TTL)return NEWS.d;const o=await api('news?orderBy=%22$key%22&limitToLast=5')||{};NEWS={t:Date.now(),d:Object.entries(o).map(([id,v])=>({id,...v})).sort((a,b)=>b.t-a.t)};return NEWS.d}
async function getCats(f){if(!f&&Date.now()-CATS.t<TTL)return CATS.d;CATS={t:Date.now(),d:await api('shopcats')||{}};return CATS.d}
async function getInv(f){if(!f&&Date.now()-INV.t<TTL)return INV.d;INV={t:Date.now(),d:await api('inv')||{}};return INV.d}
const getCodes=async()=>{codes=(await api('codes'))||{};bdg=(await api('badges'))||{};for(const k in bdg)DC[k]=bdg[k];for(const k in codes)if(!codes[k].badge)DC[k]=codes[k];return codes};
/* badge definition: new badges live in /badges, old-style codes carry their own details */
const def=k=>DC[k]||bdg[k]||codes[k]||{title:k,icon:'🎖️',rarity:'common',desc:''};
async function defs(ids){await Promise.all(ids.filter(k=>!DC[k]).map(async k=>{const b=await api('badges/'+k)||await api('codes/'+k);if(b)DC[k]=b}))}

function toast(t,fn){const e=$('#toast');e.textContent=t;e.onclick=fn?()=>{e.style.display='none';fn()}:null;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',fn?5000:2600)}

async function boot(){
  try{
    if(!await api('codes/2026-F3DP-SUPPORTER-PROD'))
      await api('codes/2026-F3DP-SUPPORTER-PROD','PUT',{title:'F3DP Supporter',desc:'Backed Dafreta Network from the start.',icon:'🏅',rarity:'legendary'});
    const s=JSON.parse(localStorage.dn_s||'null');
    if(s){const a=await api('auth/'+s.u);if(a&&a.hash===s.h)me={k:s.u,role:a.role,email:a.email||''}}
  }catch(e){return $('#app').innerHTML=`<div class="msg">${esc(e.message)}</div>`}
  await Promise.race([initLoc(),new Promise(r=>setTimeout(r,2500))]);
  const had=LOC.ok;
  try{const cgcfg=await api('config/cardgame');CGON=!!(cgcfg&&cgcfg.enabled)}catch(e){}
  afterAuth();route();earlyCheck();
  if(me&&me.role==='admin')adminSync();
  if(!had)initLoc().then(()=>{const e=$('#shop');if(e)e.outerHTML=shopHTML()});
}
/* Runs when an admin is logged in: flags admin profiles (so they are hidden from rankings/search) and removes the old demo accounts 'david' and 'test'.
   It never deletes the account you are logged in with, so you can't lock yourself out. */
async function adminSync(){
  try{
    const au=await api('auth')||{},pr=await allProfs(),o={};
    const gone=['david','test'].filter(k=>au[k]&&k!==me.k);
    gone.forEach(k=>{o['auth/'+k]=null;o['profiles/'+k]=null;o['inbox/'+k]=null;o['supportin/'+k]=null;o['supportin/m:'+k]=null;o['presence/'+k]=null;delete au[k]});
    for(const k in au){const isA=au[k].role==='admin',f=!!(pr[k]&&pr[k].adm);if(pr[k]&&isA!==f)o[`profiles/${k}/adm`]=isA?true:null}
    if(Object.keys(o).length){await mp(o);invP();if(gone.length)toast('Removed old demo accounts: '+gone.join(', '))}
    await autoEarly();
  }catch(e){}
}
function afterAuth(){inOK=false;IN=E0();SUP={};supOK=false;nav();startIn();cwInit();startBeat()}
const unseen=()=>Object.values(IN.notes).filter(n=>n.t>(+IN.seen||0)).length;
function nav(){setTimeout(watch,0);
  const fc=me?Object.keys(IN.reqs).length+unseen():0;
  $('#nl').innerHTML='<a class="l" href="#/shop" onclick="return goSec(\'shop\')">Shop</a><a class="l" href="#/news" onclick="return goSec(\'news\')">News</a>'+'<a class="l mo-only" href="#/support" onclick="openSupport();return false">Support</a>'+(me?`<a class="l" href="#/friends">Friends${fc?`<b class="dot">${fc}</b>`:''}</a><a class="l" href="#/me">My account</a>${me.role==='admin'?`<a class="l" href="#/admin" onclick="atab=pend?'orders':atab">Admin${pend?`<b class="dot">${pend}</b>`:''}</a>`:''}<a class="l" href="#/char/${me.k}">My page</a><button class="g s lo" onclick="askLogout()">Log out</button>`
  :`<a class="l" href="#/login">Log in</a><button class="s" onclick="location.hash='#/register'">Create account</button>`);tabBar(fc)}
function askLogout(){
  modal(`<div style="text-align:center;padding:10px 0 4px"><div style="font-size:54px">👋</div><div class="mt" style="margin-top:8px">Log out?</div>
  <p class="mut" style="margin:10px 0 24px">Are you sure you want to log out?</p>
  <div class="row" style="justify-content:center"><button class="d" onclick="closeM();logout()">Yes, proceed logout</button><button class="g" onclick="closeM()">No</button></div></div>`)}
function logout(){stopBeat(true);localStorage.removeItem('dn_s');stopIn();inOK=false;IN=E0();cwRemove();me=null;nav();location.hash='#/'; route()}
const view=h=>{$('#app').innerHTML=h;window.scrollTo(0,0)};
async function route(){
  const [,pg,arg,arg2]=location.hash.split('/');
  CURC=null;setNav(false);tbSel=null;setTab();
  try{
    if(pg==='login')return loginV();
    if(pg==='register')return regV();
    if(pg==='shop'||pg==='news'){if(!$('#'+pg))await homeV();return $('#'+pg).scrollIntoView({behavior:'smooth'})}
    if(pg==='char')return charV((arg||'').toLowerCase());
    if(pg==='me')return me?meV():loginV();
    if(pg==='friends')return friendsV();
    if(pg==='admin')return me&&me.role==='admin'?(arg==='user'?editV(arg2):adminV()):view('<div class="msg">Admins only.</div>');
    if(pg==='cardgame')return cardgameV();
    homeV();
  }catch(e){view(`<div class="msg">${esc(e.message)}</div>`)}
}
window.onhashchange=route;
function goSec(id){const e=$('#'+id);if(!e)return true;e.scrollIntoView({behavior:'smooth'});return false}

/* ---------- search (shallow key list + only the few matching profiles) ---------- */
let st;
function search(v){clearTimeout(st);const box=$('#sr');v=v.trim().toLowerCase();if(!v){box.style.display='none';return}
  st=setTimeout(async()=>{
    try{const ks=(await profKeys()).filter(k=>k.includes(v)).slice(0,8);
    const ps=await Promise.all(ks.map(async k=>[k,await getProf(k)]));
    const r=ps.filter(([k,p])=>p&&((me&&me.role==='admin')||(p.public&&!p.adm))).slice(0,6);
    box.innerHTML=r.length?r.map(([k,p])=>`<a href="#/char/${k}" onclick="$('#sr').style.display='none'">${av(p,32)}<span>${esc(p.name)}</span></a>`).join(''):'<a class="mut">No public players found</a>';
    box.style.display='block'}catch(e){}},300)}
document.addEventListener('click',e=>{if(!e.target.closest('.sw'))$('#sr').style.display='none'});

/* ---------- pages ---------- */
const modHead=(n,sz)=>`<div class="nwh">${av(SYS['@mod'],sz||54)}<div><b class="mod">MODERATOR</b><small class="mut">${fmt(n.t)}</small></div></div>`;
const newsCard=n=>`<article class="nw" tabindex="0" onclick="openPost('${n.id}')" onkeydown="event.key==='Enter'&&openPost('${n.id}')">${modHead(n)}<h3>${esc(n.h)}</h3>${n.s?`<h4>${esc(n.s)}</h4>`:''}<div class="nwp">${rich(n.b,true)}</div><div class="nwf"><span>💬 ${Math.max(0,+n.cc||0)} comment${(+n.cc||0)===1?'':'s'}</span><span class="rm">Read more</span></div></article>`;
const newsHTML=L=>`<section id="news"><div class="sec-h" style="margin-top:64px"><h2>News</h2><span class="mut">Updates from the team</span></div>${L.length?`<div class="news">${L.slice(0,5).map(newsCard).join('')}</div>`:'<p class="mut">No news yet. Check back soon.</p>'}</section>`;
const AWD={1:['#ffe27a','#c47f00','#f5b335','1ST','#2a1800'],2:['#d9b8ff','#7a2de0','#a24dff','2ND','#fff'],3:['#9cc8ff','#1f5fd1','#3b8bff','3RD','#fff']};
const award=n=>{const [a,b,c,t,tc]=AWD[n];return `<div class="aw" style="--ac:${c}"><svg viewBox="0 0 80 100" role="img" aria-label="${t} place"><defs><linearGradient id="ag${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><path d="M20 50 L8 96 L26 86 L36 98 L44 52Z" fill="${b}"/><path d="M60 50 L72 96 L54 86 L44 98 L36 52Z" fill="${b}" opacity=".85"/><circle cx="40" cy="34" r="30" fill="url(#ag${n})" stroke="#fff" stroke-opacity=".6" stroke-width="2"/><circle cx="40" cy="34" r="23" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="40" y="42" text-anchor="middle" font-family="Chakra Petch,sans-serif" font-weight="700" font-size="22" fill="${tc}" stroke="#0006" stroke-width="${n===1?0:2.5}" paint-order="stroke">${t}</text></svg></div>`};
async function homeV(){
  const [all,news]=await Promise.all([allProfs(),getNews(),getInv(),getCats()]);
  const pr=Object.values(all).filter(p=>p.public&&!p.adm).sort((a,b)=>cnt(b)-cnt(a)).slice(0,12);
  const you=me?(await getProf(me.k)||{}):{avatar:0,frame:'gold'};
  const lk=p=>'#/char/'+p.name.toLowerCase(),top=pr.slice(0,3),rest=pr.slice(3);
  view(`<section class="heroW"><canvas id="pt"></canvas><div class="hero"><div><h1>Your name.<br>Your <em>badges.</em></h1>
  <p>Create a character, redeem codes from events and supporters, and show off every badge on your public page. Games are on the way.</p>
  <div class="row">${me?`<button onclick="location.hash='#/char/${me.k}'">View my page</button>`:`<button onclick="location.hash='#/register'">Create account</button><button class="g" onclick="location.hash='#/login'">Log in</button>`}<button class="g" onclick="goSec('shop')">Visit shop</button></div></div>
  <div style="display:grid;place-items:center">${av(you,220)}</div></div></section>
  ${(CGON||(me&&me.role==='admin'))?`<div class="box" style="margin:22px 0;padding:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap"><div><h2 style="margin:0">Dafreta Card Battle</h2><p class="mut" style="margin:6px 0 0">4v4 card duel. Build your team and battle!${CGON?'':' (Admin preview — OFF for players)'}</p></div><button onclick="location.hash='#/cardgame'">▶ Play Now!</button></div>`:''}
  <div class="sec-h"><h2>Top collectors</h2><span class="mut">Most badges earned</span></div>
  ${pr.length?'':'<p class="mut">No public players yet.</p>'}
  <div class="pod">${top.map((p,i)=>`<a class="pc r${i+1}" href="${lk(p)}">${award(i+1)}${av(p,i?112:148)}<b>${esc(p.name)}</b><span class="mut">${cnt(p)} badges</span></a>`).join('')}</div>
  <div class="cols">${rest.map((p,i)=>`<a class="pl" href="${lk(p)}"><i class="rn">${i+4}</i>${av(p,56)}<div><b>${esc(p.name)}</b><span>${cnt(p)} badges</span></div></a>`).join('')}</div>
  ${newsHTML(news)}
  ${shopHTML()}`);
  fades();particles();
}
function loginV(){

const shrink=(f,max,q,sq)=>new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const c=document.createElement('canvas'),g=c.getContext('2d');let w=im.width,h=im.height;
    if(sq){const m=Math.min(w,h);c.width=c.height=max;g.drawImage(im,(w-m)/2,(h-m)/2,m,m,0,0,max,max)}
    else{const k=Math.min(1,max/Math.max(w,h));c.width=Math.round(w*k);c.height=Math.round(h*k);g.drawImage(im,0,0,c.width,c.height)}
    URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>no(new Error('Could not read that image.'));im.src=u});

    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);

async function importDefaults(){
  if(!confirm('Import the 5 built-in heroes (Knight, Mage, Priest, Marksman, Adventurer) so you can edit them?\n\nAfter this, the game uses the heroes stored here instead of its built-in copies. Heroes already imported are left untouched.'))return;
  try{
    const have=await api('cardgame/heroes').catch(()=>null)||{},ails=await api('cardgame/ailments').catch(()=>null)||{};
    for(const [id,a] of Object.entries(DEFAULT_AILS))if(!ails[id])await api('cardgame/ailments/'+id,'PUT',a);
    const t0=Date.now();
    for(let i=0;i<DEFAULT_HEROES.length;i++){const d=DEFAULT_HEROES[i],id='hd_'+d.key;if(!have[id])await api('cardgame/heroes/'+id,'PUT',{...d.data,created:t0+i,updated:t0+i})}
    toast('Default heroes imported. You can edit them below.');atab='cardgame';adminV()
  }catch(e){toast(e.message)}}

let CF=emptyCF(),RF=emptyRF(),GF=emptyGF(),RELS={},GENS={};
const CARD_TYPES=[['attack','Attack — damages the front enemy'],['heal','Heal — restores HP to an ally'],['mana','Mana — gain energy'],['draw','Draw — draw cards from the deck'],['buff','Buff — shield / buff an ally'],['debuff','Debuff — weakens the front enemy'],['ultimate','Ultimate — only used as the hero\u2019s ultimate']];

const TYPE_ICON={attack:'⚔️',heal:'💚',mana:'💎',draw:'🎴',buff:'🛡️',debuff:'☠️',ultimate:'🌟'};
const ULT_FX=[['all','Damage ALL enemies'],['front','Damage the front enemy'],['heal','Heal the WHOLE team'],['shield','Shield the WHOLE team'],['ally','Heal / shield / buff ONE chosen ally']];
const RELIC_FX={
 ex_turn:['Ultimate charge: +meter every turn','Gains {v} ultimate meter at the start of every turn'],

const relicText=(e,v)=>((RELIC_FX[e]||['',''])[1]).replace('{v}',+v||0);
const GEN_FX={
 dmg:['Damage the front enemy','Deal {v} damage to the front enemy'],
 dmg_all:['Damage ALL enemies','Deal {v} damage to all enemies'],
 heal:['Heal one ally','Heal an ally for {v}'],

 shield:['Shield one ally','Give an ally {v} shield'],

const GEN_ICON={dmg:'💥',dmg_all:'🌋',heal:'💚',heal_all:'✨',shield:'🛡️',shield_all:'🏰',energy:'💎',draw:'🎴',bomb:'💣'};
const genText=g=>((GEN_FX[g.effect]||['',''])[1]).replace('{v}',+g.value||0).replace('{d}',+g.delay||2)+(AILS[g.ail]?' + '+AILS[g.ail].name+' ('+(+g.dur||2)+'t)':'');
function cardText(c){const v=+c.value||0,a=AILS[c.ail],ad=a?' + '+a.name+' ('+(+c.dur||2)+'t)':'',hits=+c.hits>1?' ×'+(+c.hits):'',reach={pierce:' (+foe behind)',all:' (all foes)'}[c.scope]||'';
  const ex=[+c.shield?'+'+(+c.shield)+' shield':'',+c.heal?'heal '+(+c.heal):'',+c.draw?'draw '+(+c.draw):''].filter(Boolean).join(', ');let t;
  switch(c.type){
    case 'heal':t='Heal '+v+ad;break;
    case 'mana':t='Gain '+v+' energy';break;
    case 'draw':t='Draw '+v+' card(s)';break;
    case 'buff':t=a?'Apply '+a.name+' ('+(+c.dur||2)+'t) to an ally':'Gain '+v+' shield';break;
    case 'debuff':t=(v?'Deal '+v+' dmg'+hits+reach+' + ':'')+(a?'Apply '+a.name+' ('+(+c.dur||2)+'t)':'');break;
    case 'ultimate':t=({all:'Deal '+v+' dmg to ALL foes'+ad,front:'Deal '+v+' dmg to the front foe'+ad,heal:'Heal the whole team for '+v+ad,shield:'Shield the whole team for '+v+ad,ally:'One ally: '+[v?'heal '+v:'',a?a.name+' ('+(+c.dur||2)+'t)':''].filter(Boolean).join(', ')}[c.ult||'all']);break;
    default:t='Deal '+v+' dmg'+hits+reach+ad}
  return t+(ex?' · '+ex:'')}
const ailOpts=sel=>{const b=Object.entries(AILS),g=t=>b.filter(([,a])=>a.type===t).map(([k,a])=>`<option value="${esc(k)}"${sel===k?' selected':''}>${esc(a.name)} — ${AIL_EFFECTS[a.effect]||a.effect}</option>`).join('');
  return '<option value="">None</option>'+(g('debuff')?`<optgroup label="Debuffs">${g('debuff')}</optgroup>`:'')+(g('buff')?`<optgroup label="Buffs">${g('buff')}</optgroup>`:'')};

function heroCardHTML(id,h){

  const icon=HERO_ICONS[cls]||'⚔️',hc=HERO_COLORS[cls]||'var(--gold)';
  const cs=Array.isArray(h.cards)?h.cards:Object.values(h.cards||{});
  const hasUlt=cs.some(c=>c&&c.type==='ultimate'),playable=cs.some(c=>c&&c.name&&c.type!=='ultimate');
  return `<div class="box" style="padding:16px;display:flex;flex-direction:column;border-top:3px solid ${hc}">
    <div style="display:flex;gap:12px;align-items:flex-start">
      ${h.img?`<img src="${esc(h.img)}" referrerpolicy="no-referrer" alt="" style="width:72px;height:72px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);flex:none">`:`<div style="width:72px;height:72px;background:#14243c;border-radius:8px;display:grid;place-items:center;font-size:34px;flex:none">${icon}</div>`}

async function mkCodes(id,n,perm){
  n=perm?1:Math.min(10,Math.max(1,+n||1));const o={};
  while(Object.keys(o).length<n){const c=gen();if(!codes[c]&&!o[c])o[c]={badge:id,created:Date.now(),...(perm?{perm:true}:{})}}
  await api('codes','PATCH',o);Object.assign(codes,o);return n}

async function addBadge(){
  const t=$('#nt').value.trim(),ic=$('#ni').value.trim(),m=$('#m');

  if(!bimg&&!ic)return m.innerHTML='<div class="msg">Upload a badge image (or enter a fallback emoji).</div>';
  try{

    await api('badges/'+id,'PUT',{title:t,rarity:$('#nr').value,desc:$('#nd').value.trim(),full:$('#nf').value.trim(),icon:ic||'🎖️',img:bimg||null,created:Date.now()});

async function delBadge(id){
  if(!confirm('Delete this badge, all its codes, and remove it from every player who earned it?'))return;
  const pr=await api('profiles')||{};
  for(const [k,p] of Object.entries(pr))if(p.badges&&p.badges[id])await api(`profiles/${k}/badges/${id}`,'DELETE');
  for(const [c,d] of Object.entries(codes))if(d.badge===id)await api('codes/'+c,'DELETE');
  await api('badges/'+id,'DELETE');delete DC[id];{const ec=await api('config/early');if(ec&&ec.badge===id)await api('config/early','PATCH',{badge:''})}invP();toast('Badge deleted');adminV()}

  const tr=e.currentTarget.closest('tr');DR={tr,t:null,b:false};tr.classList.add('drg');
  document.addEventListener('pointermove',dragMove);document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragEnd)}
function dragMove(e){
  if(!DR)return;
  if(e.clientY<70)window.scrollBy(0,-14);else if(e.clientY>innerHeight-70)window.scrollBy(0,14);
  clrDrop();DR.t=null;
  for(const r of document.querySelectorAll('#invt tr[data-id]')){if(r===DR.tr)continue;const b=r.getBoundingClientRect();
    if(e.clientY>=b.top&&e.clientY<=b.bottom){DR.t=r;DR.b=e.clientY>=b.top+b.height/2;r.classList.add(DR.b?'db':'dt');break}}}
async function dragEnd(){
  document.removeEventListener('pointermove',dragMove);document.removeEventListener('pointerup',dragEnd);document.removeEventListener('pointercancel',dragEnd);
  const d=DR;DR=null;if(!d)return;
  d.tr.classList.remove('drg');clrDrop();if(!d.t)return;
  d.t.parentNode.insertBefore(d.tr,d.b?d.t.nextSibling:d.t);
  const rows=[...document.querySelectorAll('#invt tr[data-id]')],o={};
  rows.forEach((r,i)=>{const s=r.querySelector('.pos');if(s)s.textContent=i+1;o[`inv/${r.dataset.id}/order`]=i});
  try{await mp(o);rows.forEach((r,i)=>{if(INV.d[r.dataset.id])INV.d[r.dataset.id].order=i});INV.t=0;toast('Shop order saved')}catch(x){toast(x.message)}}
async function resetOrder(){if(!confirm('Go back to showing the newest products first?'))return;
  const o={};Object.keys(INV.d).forEach(id=>o[`inv/${id}/order`]=null);
  try{await mp(o);INV.t=0;toast('Order reset: newest first');adminV()}catch(e){toast(e.message)}}

/* ---------- particles ---------- */
function particles(id,fx){
  const c=$('#'+(id||'pt'));if(!c)return;const host=c.parentElement,x=c.getContext('2d');if(!x)return;
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches,dpr=Math.min(2,window.devicePixelRatio||1);
  const GOLD='245,179,53',BLUE='59,139,255',CY='96,200,255',VI='162,77,255';
  let W=0,H=0,E=[],O=[],R=[],S=[],mx=null,my=null,vis=true,last=performance.now(),nextS=1.2;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const pickC=()=>{const r=Math.random();return r<.45?GOLD:r<.8?BLUE:r<.92?CY:VI};
  const mkE=init=>({x:rnd(0,W),y:init?rnd(0,H):H+rnd(5,40),r:rnd(.8,2.6),vy:rnd(14,48),sw:rnd(.6,2),ph:rnd(0,6.3),a:rnd(.45,1),c:pickC(),vx:0});
  const mkR=init=>({x:rnd(0,W),y:init?rnd(0,H):H+30,s:rnd(5,13),vy:rnd(8,22),rot:rnd(0,6.3),vr:rnd(-.6,.6),ph:rnd(0,6.3),c:Math.random()<.6?GOLD:BLUE});
  const mkO=()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(90,220),vx:rnd(-9,9),vy:rnd(-6,6),c:[BLUE,VI,GOLD][Math.floor(Math.random()*3)],a:rnd(.06,.13)});
  const size=()=>{const nw=host.clientWidth,nh=host.clientHeight;if(!nw||!nh)return;const re=!E.length||nw!==W||Math.abs(nh-H)>150;W=nw;H=nh;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);if(!re)return;
    const n=Math.max(18,Math.min(fx?55:80,Math.round(W/(fx?20:16))));
    E=Array.from({length:n},()=>mkE(true));R=Array.from({length:Math.max(3,Math.round(n/6))},()=>mkR(true));O=Array.from({length:4},mkO)};
  size();new ResizeObserver(size).observe(host);
  const tgt=fx?window:host,mv=e=>{if(!c.isConnected){tgt.removeEventListener('pointermove',mv);return}const b=host.getBoundingClientRect();mx=e.clientX-b.left;my=e.clientY-b.top};tgt.addEventListener('pointermove',mv);
  if(fx){const out=e=>{if(!c.isConnected){document.removeEventListener('pointerout',out);return}if(!e.relatedTarget)mx=my=null};document.addEventListener('pointerout',out)}else host.addEventListener('pointerleave',()=>{mx=my=null});
  if('IntersectionObserver' in window)new IntersectionObserver(en=>{vis=en[0].isIntersecting}).observe(host);
  function frame(t){
    if(!c.isConnected)return;
    if(!still)requestAnimationFrame(frame);
    const dt=Math.min(.05,(t-last)/1000)||.016;last=t;
    if(!W||!H||(!vis&&!still)||document.hidden)return;
    x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
    for(const o of O){
      if(!still){o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.x<-o.r)o.x=W+o.r;if(o.x>W+o.r)o.x=-o.r;if(o.y<-o.r)o.y=H+o.r;if(o.y>H+o.r)o.y=-o.r}
      const g=x.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);g.addColorStop(0,`rgba(${o.c},${o.a})`);g.addColorStop(1,`rgba(${o.c},0)`);x.fillStyle=g;x.fillRect(o.x-o.r,o.y-o.r,o.r*2,o.r*2)}
    if(!still){nextS-=dt;if(nextS<=0){nextS=rnd(2.2,5);S.push({x:rnd(W*.3,W*1.1),y:rnd(-20,H*.4),vx:-rnd(420,700),vy:rnd(220,360),life:0,max:rnd(.7,1.1),c:Math.random()<.6?GOLD:CY})}}
    for(let i=S.length-1;i>=0;i--){const q=S[i];q.life+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;const k=1-q.life/q.max;if(k<=0){S.splice(i,1);continue}
      const m=Math.hypot(q.vx,q.vy),dx=q.vx/m*90,dy=q.vy/m*90,g=x.createLinearGradient(q.x,q.y,q.x-dx,q.y-dy);
      g.addColorStop(0,`rgba(${q.c},${.9*k})`);g.addColorStop(1,`rgba(${q.c},0)`);x.strokeStyle=g;x.lineWidth=2;x.lineCap='round';x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.x-dx,q.y-dy);x.stroke()}
    for(const r of R){
      if(!still){r.y-=r.vy*dt;r.rot+=r.vr*dt;r.ph+=dt*1.4;if(r.y<-30)Object.assign(r,mkR(false))}
      const a=.3+.25*Math.sin(r.ph);x.save();x.translate(r.x,r.y);x.rotate(r.rot);x.strokeStyle=`rgba(${r.c},${a+.15})`;x.lineWidth=1.4;x.shadowColor=`rgba(${r.c},.9)`;x.shadowBlur=10;
      x.beginPath();x.moveTo(0,-r.s);x.lineTo(r.s*.7,0);x.lineTo(0,r.s);x.lineTo(-r.s*.7,0);x.closePath();x.stroke();x.restore()}
    for(const p of E){
      if(!still){p.ph+=dt*p.sw;p.y-=p.vy*dt;p.x+=Math.sin(p.ph)*18*dt+p.vx*dt;p.vx*=.96}
      if(mx!==null&&!still){const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);
        if(d<130&&d>0){const f=(1-d/130)*220;p.vx+=dx/d*f*dt;p.y+=dy/d*f*dt*.4;x.strokeStyle=`rgba(${p.c},${.3*(1-d/130)})`;x.lineWidth=1;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(mx,my);x.stroke()}}
      if(p.y<-10)Object.assign(p,mkE(false));
      const tw=.65+.35*Math.sin(p.ph*2.3);x.fillStyle=`rgba(${p.c},${p.a*tw})`;x.shadowColor=`rgba(${p.c},1)`;x.shadowBlur=9;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
    x.shadowBlur=0;x.globalCompositeOperation='source-over'}
  frame(performance.now()+16)
}

   Country comes from a free IP lookup (falls back to the browser timezone/language). Prices are stored in PHP and converted with free daily exchange rates. */
const CCUR=Object.fromEntries('AE:AED AF:AFN AL:ALL AM:AMD AR:ARS AT:EUR AU:AUD AZ:AZN BA:BAM BD:BDT BE:EUR BG:BGN BH:BHD BN:BND BO:BOB BR:BRL BY:BYN CA:CAD CH:CHF CL:CLP CN:CNY CO:COP CR:CRC CY:EUR CZ:CZK DE:EUR DK:DKK DO:DOP DZ:DZD EC:USD EE:EUR EG:EGP ES:EUR ET:ETB FI:EUR FR:EUR GB:GBP GE:GEL GH:GHS GR:EUR GT:GTQ GU:USD HK:HKD HN:HNL HR:EUR HU:HUF ID:IDR IE:EUR IL:ILS IN:INR IQ:IQD IS:ISK IT:EUR JM:JMD JO:JOD JP:JPY KE:KES KH:KHR KR:KRW KW:KWD KZ:KZT LA:LAK LB:LBP LK:LKR LT:EUR LU:EUR LV:EUR MA:MAD MM:MMK MN:MNT MO:MOP MT:EUR MU:MUR MV:MVR MX:MXN MY:MYR NG:NGN NL:EUR NO:NOK NP:NPR NZ:NZD OM:OMR PA:USD PE:PEN PH:PHP PK:PKR PL:PLN PR:USD PT:EUR PY:PYG QA:QAR RO:RON RS:RSD RU:RUB SA:SAR SE:SEK SG:SGD SI:EUR SK:EUR SV:USD TH:THB TN:TND TR:TRY TW:TWD TZ:TZS UA:UAH UG:UGX US:USD UY:UYU UZ:UZS VE:VES VN:VND ZA:ZAR ZM:ZMW'.split(' ').map(x=>x.split(':')));
const fetchT=(u,ms)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(t))};
let LOC={cc:'PH',cur:'PHP',rate:1,ph:true,ok:false},LP=null;
const initLoc=()=>LP||(LP=locInit());
function guessCC(){try{if(/Manila/i.test(Intl.DateTimeFormat().resolvedOptions().timeZone||''))return 'PH'}catch(e){}
  for(const l of (navigator.languages||[navigator.language||''])){const m=/[-_]([A-Za-z]{2})$/.exec(l);if(m)return m[1].toUpperCase()}
  return 'PH'}
async function detectCC(){
  try{const c=JSON.parse(localStorage.dn_cc||'null');if(c&&Date.now()-c.t<36e5&&/^[A-Z]{2}$/.test(c.cc))return c.cc}catch(e){}
  const src=[['https://api.country.is/',j=>j.country],['https://get.geojs.io/v1/ip/country.json',j=>j.country],['https://ipapi.co/json/',j=>j.country_code]];
  for(const [u,f] of src){try{const j=await(await fetchT(u,2500)).json(),cc=String(f(j)||'').toUpperCase();
    if(/^[A-Z]{2}$/.test(cc)){try{localStorage.dn_cc=JSON.stringify({cc,t:Date.now()})}catch(e){}return cc}}catch(e){}}
  return guessCC()}
async function getRate(cur){
  try{const c=JSON.parse(localStorage.dn_fx||'null');if(c&&Date.now()-c.t<432e5&&c.r[cur])return c.r[cur]}catch(e){}
  try{const j=await(await fetchT('https://open.er-api.com/v6/latest/PHP',3000)).json();
    if(j&&j.rates&&j.rates[cur]){try{localStorage.dn_fx=JSON.stringify({t:Date.now(),r:j.rates})}catch(e){}return j.rates[cur]}}catch(e){}
  try{const j=await(await fetchT('https://api.frankfurter.app/latest?from=PHP&to='+cur,3000)).json();if(j&&j.rates&&j.rates[cur])return j.rates[cur]}catch(e){}
  return 0}
async function locInit(){
  try{const cc=await detectCC(),cur=CCUR[cc]||'USD';let rate=1,use=cur;
    if(cur!=='PHP'){rate=await getRate(cur);if(!rate){use='PHP';rate=1}}
    LOC={cc,cur:use,rate,ph:cc==='PH',ok:true}}catch(e){}}

/* ---------- SUPPORT: every account can write to Support; admins answer as "Support" (their own name is never shown) ----------
   chats/{@support~user}/{id} = {f:user | '@support', t, ts}    supportin/{user} = {t, p, u:1 while waiting for an admin reply} */
let SUP={},supOK=false,ses=null;
const supN=()=>me&&me.role==='admin'?Object.values(SUP).filter(x=>x&&x.u).length:0;
function startSup(){stopSup();if(!me||me.role!=='admin'||document.hidden)return;
  ses=new EventSource(`${DB}/supportin.json`);
  const h=e=>{try{onSup(e.type,JSON.parse(e.data))}catch(x){}};
  ses.addEventListener('put',h);ses.addEventListener('patch',h)}
function stopSup(){ses&&ses.close();ses=null}
function onSup(type,{path,data}){
  const was=new Set(Object.keys(SUP).filter(k=>SUP[k]&&SUP[k].u)),pt=(path||'/').split('/').filter(Boolean);
  const merge=(o,d)=>{for(const k in (d||{})){if(d[k]===null)delete o[k];else o[k]=d[k]}};
  if(!pt.length){if(type==='put')SUP=data||{};else merge(SUP,data)}
  else if(pt.length===1){if(type==='put'){if(data===null)delete SUP[pt[0]];else SUP[pt[0]]=data}else{const e=SUP[pt[0]]=SUP[pt[0]]||{};merge(e,data)}}
  else{const e=SUP[pt[0]]=SUP[pt[0]]||{};if(type==='put'){if(data===null)delete e[pt[1]];else e[pt[1]]=data}else merge(e,data)}
  for(const k of Object.keys(SUP))if(!SUP[k]||!Object.keys(SUP[k]).length)delete SUP[k];
  const open=CH.open&&CH.with?(CH.with.startsWith('sup:')?CH.with.slice(4):CH.with.startsWith('mod:')?'m:'+CH.with.slice(4):''):'';
  for(const k in SUP){if(SUP[k].u&&!was.has(k)){
    if(k===open)markSup(k);else if(supOK)toast(k.startsWith('m:')?`Moderator: reply from ${k.slice(2)}`:`Support: new message from ${k}`,()=>k.startsWith('m:')?openMod(k.slice(2)):openSup(k))}}
  supOK=true;cwBadge();if(CH.open&&CH.with==='sup:')supInbox()}

/* Admin > Players > Message: the player sees this as MODERATOR, never the admin account name */

  t.innerHTML=tbi('home','Home','#/',"tbOn(this);if(!location.hash||location.hash==='#/'){scrollTo({top:0,behavior:'smooth'});return false}")
   +tbi('shop','Shop','#/shop',"tbOn(this);return goSec('shop')")
   +tbi('news','News','#/news',"tbOn(this);return goSec('news')")
   +(me?tbi('friends','Friends','#/friends','tbOn(this)',fc?`<b class="tdot">${fc}</b>`:'')+tbi('me','Me','#/char/'+me.k,'tbOn(this)'):tbi('login','Log in','#/login','tbOn(this)'));
  setTab()}
function tbOn(el){tbSel=el.dataset.k;document.querySelectorAll('.tbi').forEach(a=>a.classList.toggle('on',a===el))}
function setTab(){const [,pg,arg]=location.hash.split('/');
  const k=tbSel||(!pg?'home':pg==='shop'?'shop':pg==='news'?'news':pg==='friends'?'friends':(pg==='me'||(pg==='char'&&me&&arg===me.k))?'me':(pg==='login'||pg==='register')?'login':'');
  document.querySelectorAll('.tbi').forEach(a=>a.classList.toggle('on',a.dataset.k===k))}
$('#nl').addEventListener('click',e=>{if(e.target.closest('a,button'))setNav(false)});
$('#sr').addEventListener('click',e=>{if(e.target.closest('a[href]'))document.body.classList.remove('ms')});
matchMedia('(min-width:761px)').addEventListener('change',e=>{if(e.matches)document.body.classList.remove('mo','ms')});
/* ---------- activity: "Active now" / "Last active ...", written as presence/{user} = {t, on} ---------- */
let hbT=0,PRS={};
const beat=on=>{if(!me)return;try{fetch(`${DB}/presence/${me.k}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:Date.now(),on:on?1:0}),keepalive:true}).catch(()=>{})}catch(e){}};
function startBeat(){stopBeat();if(!me)return;if(!document.hidden)beat(true);hbT=setInterval(()=>{if(!document.hidden&&me)beat(true)},90000)}
function stopBeat(off){clearInterval(hbT);hbT=0;if(off)beat(false)}
document.addEventListener('visibilitychange',()=>{if(me)beat(!document.hidden)});
addEventListener('pagehide',()=>{if(me)beat(false)});
async function loadPres(keys,all){
  const now=Date.now(),need=keys.filter(k=>!PRS[k]||now-PRS[k].f>45000);
  if(!need.length)return;
  if(all||need.length>6){const d=await api('presence')||{},f=Date.now();for(const k in d)PRS[k]={...d[k],f};for(const k of keys)if(!d[k])PRS[k]={f}}
  else await Promise.all(need.map(async k=>{const d=await api('presence/'+k).catch(()=>null);PRS[k]={...(d||{}),f:Date.now()}}))}
const isOn=k=>{if(me&&k===me.k)return !document.hidden;const p=PRS[k];return !!(p&&p.on&&Date.now()-p.t<180000)};
const longAgo=t=>{const s=Math.max(0,(Date.now()-t)/1000);if(s<60)return 'just now';const m=Math.floor(s/60);if(m<60)return m+(m===1?' minute':' minutes')+' ago';
  const h=Math.floor(m/60);if(h<24)return h+(h===1?' hour':' hours')+' ago';const d=Math.floor(h/24);if(d<7)return d+(d===1?' day':' days')+' ago';
  if(d<30){const w=Math.floor(d/7);return w+(w===1?' week':' weeks')+' ago'}if(d<365){const o=Math.floor(d/30);return o+(o===1?' month':' months')+' ago'}const y=Math.floor(d/365);return y+(y===1?' year':' years')+' ago'};
const presH=k=>{if(isOn(k))return '<span class="pres on"><i></i>Active now</span>';const p=PRS[k];
  return p&&p.t?`<span class="pres"><i></i>Last active ${longAgo(p.t)}</span>`:'<span class="pres"><i></i>Offline</span>'};

/* ---------- admin: tab totals + edit badge description ---------- */
const CNC={t:0,n:0};
async function adminCounts(){
  const [pl,inv,nw,od,bd,hh]=await Promise.all(['auth','inv','news','orders','badges','cardgame/heroes'].map(p=>skeys(p).catch(()=>[])));
  if(Date.now()-CNC.t>60000){try{const c=await api('codes')||{},ids=new Set(bd);for(const k in c)ids.add(c[k].badge||k);CNC.n=ids.size;CNC.t=Date.now()}catch(e){CNC.n=bd.length}}
  return {players:pl.length,codes:CNC.n||bd.length,inv:inv.length,news:nw.length,orders:od.length,cardgame:hh.length}}
function editBadge(id){const d=def(id);
  modal(`<div class="mt" style="padding-right:40px">Edit description</div><p class="mut" style="margin:6px 0 4px">${esc(d.title)}</p><div id="m"></div>
  <label>Short description (shown on the card)</label><input id="ed1" maxlength="160" value="${esc(d.desc||'')}">
  <label>Full description (shown when the badge is clicked)</label><textarea id="ed2" maxlength="2000" style="min-height:150px">${esc(d.full||'')}</textarea>
  <div class="row" style="margin-top:18px"><button onclick="saveBadgeDesc('${id}')">Save</button><button class="g" onclick="closeM()">Cancel</button></div>`,520)}
async function saveBadgeDesc(id){
  const desc=$('#ed1').value.trim(),full=$('#ed2').value.trim(),isNew=!!bdg[id];
  try{await api((isNew?'badges/':'codes/')+id,'PATCH',{desc,full:full||null});
    const o=(isNew?bdg:codes)[id];if(o){o.desc=desc;if(full)o.full=full;else delete o.full}
    if(DC[id]&&DC[id]!==o){DC[id].desc=desc;if(full)DC[id].full=full;else delete DC[id].full}
    closeM();toast('Badge description updated');adminV()
  }catch(e){const m=$('#m');if(m)m.innerHTML=`<div class="msg">${esc(e.message)}</div>`}}
boot();
